<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선행연구 분석 실습 교안</title>
<meta name="description" content="연세대 BK21 대학원생 워크숍: 학술 DB와 Claude로 선행연구를 분석하고 나의 핵심 연구 질문을 찾는 실습 교안">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{
    --red:#E63946; --red-dk:#C1272D; --red-bg:#FFF1F2; --red-line:#F6C9CE;
    --ink:#15171A; --body:#33373D; --muted:#6B7280; --faint:#9AA1AC;
    --line:#E7E8EB; --soft:#F7F8FA; --bg:#F1F2F4; --white:#fff;
    --green:#0E8A5F; --green-bg:#E6F5EE; --blue:#2458D3; --blue-bg:#ECF2FF;
    --amber:#A85A06; --amber-bg:#FFF4E2; --purple:#6D3AD6; --purple-bg:#F2ECFF;
    --r:14px; --top:58px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--top) + 12px)}
  body{margin:0;background:var(--bg);color:var(--body);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;line-height:1.65;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  a{color:var(--blue)}

  /* 상단 바 */
  .top{position:fixed;inset:0 0 auto 0;height:var(--top);background:#1B1012;color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:30}
  .top .brand{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .brand small{font-weight:500;color:#F3B9BF;margin-left:8px}
  .prog{flex:1;display:flex;align-items:center;gap:10px;min-width:120px;max-width:420px;margin-left:auto}
  .prog .bar{flex:1;height:8px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF7A85,#E63946);transition:width .3s}
  .prog .txt{font-size:13px;font-weight:700;white-space:nowrap}
  .tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tbtn:hover{background:rgba(255,255,255,.18)}
  .menu-btn{display:none}

  /* 레이아웃 */
  .shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;padding-top:var(--top);min-height:100vh}
  nav.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;background:#fff;border-right:1px solid var(--line);padding:16px 12px 40px}
  .side .grp{font-size:11.5px;font-weight:800;color:var(--faint);letter-spacing:.06em;margin:14px 10px 6px}
  .side a.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
  .side a.item:hover{background:var(--soft)}
  .side a.item.on{background:var(--red-bg);color:var(--red-dk)}
  .side a.item .n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
  .side a.item.on .n{background:var(--red);color:#fff;border-color:var(--red)}
  .side a.item.done .n{background:var(--green);color:#fff;border-color:var(--green)}
  .side a.item .t{flex:1;min-width:0}
  .side a.item .c{font-size:11.5px;color:var(--faint);font-weight:700}
  .side .subs{margin:2px 0 6px 46px;padding:0;list-style:none}
  .side .subs a{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);text-decoration:none;padding:3px 4px;border-radius:6px}
  .side .subs a:hover{color:var(--ink)}
  .dot{flex:none;width:9px;height:9px;border-radius:50%;border:2px solid var(--line);background:#fff}
  .dot.ok{border-color:var(--green);background:var(--green)}
  .dot.opt{border-style:dashed}

  main{padding:28px 32px 120px;max-width:920px;width:100%}

  /* 페이지 머리 */
  .phead{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;margin-bottom:18px}
  .phead .kick{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--red);letter-spacing:.06em}
  .phead h1{font-size:27px;line-height:1.3;color:var(--ink);margin:6px 0 8px;letter-spacing:-.03em}
  .phead .one{font-size:16px;color:var(--body);margin:0}
  .phead .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--body)}
  .chip.out{background:var(--red-bg);border-color:var(--red-line);color:var(--red-dk)}
  .minimap{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .minimap a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px}
  .minimap a.ok{color:var(--green);border-color:#BFE4D2;background:var(--green-bg)}

  /* 세부 단계 카드 */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
  .card.isdone{border-color:#BFE4D2}
  .card > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:18px 22px}
  .card > summary::-webkit-details-marker{display:none}
  .card .sid{flex:none;font-size:13px;font-weight:800;color:var(--red);background:var(--red-bg);border-radius:8px;padding:4px 9px}
  .card.isdone .sid{color:var(--green);background:var(--green-bg)}
  .card .stitle{flex:1;font-size:17.5px;font-weight:800;color:var(--ink);line-height:1.35}
  .card .sm{font-size:12.5px;color:var(--faint);font-weight:700;white-space:nowrap}
  .badge{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .badge.demo{background:var(--purple-bg);color:var(--purple)}
  .badge.opt{background:var(--amber-bg);color:var(--amber)}
  .badge.ok{background:var(--green);color:#fff}
  .card .caret{width:10px;height:10px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .2s}
  .card[open] .caret{transform:rotate(225deg);margin:4px 4px 0 0}
  .cbody{padding:0 22px 22px}
  .why{background:var(--soft);border-radius:11px;padding:12px 15px;font-size:14px;color:var(--body);margin-bottom:6px}
  .why b{color:var(--ink)}

  .beat{position:relative;padding:16px 0 4px 46px;border-top:1px dashed var(--line);margin-top:14px}
  .beat:first-of-type{border-top:none}
  .beat .bn{position:absolute;left:0;top:16px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
  .beat h3{font-size:15.5px;color:var(--ink);margin:4px 0 4px}
  .beat .sub{font-size:13px;color:var(--muted);margin:0 0 10px}

  .fld{margin:10px 0}
  .fld label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .fld .hint{font-size:12.5px;color:var(--muted);margin:-2px 0 6px}
  .fld input,.fld textarea{width:100%;border:1px solid #D7D9DE;border-radius:10px;padding:10px 12px;background:#fff;line-height:1.55;outline:none}
  .fld textarea{min-height:76px;resize:vertical}
  .fld input:focus,.fld textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,57,70,.12)}
  .fld .eg{font-size:12px;color:var(--faint);margin-top:4px}
  .fld .eg b{color:var(--muted);font-weight:600}

  .tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pbox{position:relative;background:#1E2126;color:#E9EAEC;border-radius:12px;padding:16px 16px 14px;font-size:13.5px;line-height:1.7}
  .pbox pre{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:inherit}
  .pbox .slot{background:#4A2E31;color:#FFB3BA;border-radius:5px;padding:0 4px}
  .pbox mark{background:#2F4A3C;color:#B8F0D2;border-radius:5px;padding:0 4px}
  .pbox .copy{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .pbox .copy.ok{background:var(--green)}
  .pnote{font-size:12.5px;color:var(--muted);margin-top:8px}
  .pnote.warn{color:var(--red-dk);font-weight:600}
  .rows{margin-top:10px;display:grid;gap:6px}
  .row{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13.5px;align-items:start}
  .row .k{font-weight:700;color:var(--muted)}
  .row.pick .k{color:var(--red-dk)}
  .follow{margin-top:10px;background:var(--blue-bg);border-radius:10px;padding:10px 14px;font-size:13px}
  .follow b{color:var(--blue)}
  .follow p{margin:6px 0 0}

  details.ex{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff}
  details.ex > summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  details.ex > summary::-webkit-details-marker{display:none}
  details.ex > summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
  details.ex[open] > summary::before{transform:rotate(45deg)}
  details.ex .exb{padding:0 14px 14px}
  .res{margin:4px 0 0;padding-left:18px}
  .res li{margin:4px 0;font-size:14px}
  .figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
  .figs figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);cursor:zoom-in}
  .figs img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
  .figs figcaption{font-size:12px;color:var(--muted);padding:7px 9px;line-height:1.45}
  .err{margin-top:10px;background:var(--amber-bg);border-left:4px solid #E3A13B;border-radius:8px;padding:10px 13px;font-size:13.5px}
  .err b{display:block;color:var(--amber);margin-bottom:2px}

  .hooks{display:grid;gap:7px;margin:8px 0 4px}
  .hook{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  .hook .d{font-size:12px;font-weight:800;color:var(--red-dk)}
  .samplepick{margin-top:8px;font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:9px 12px}
  .samplepick b{color:var(--ink)}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:4px}
  .tag.real{background:var(--green-bg);color:var(--green)}
  .tag.eg{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
  .mine{margin-top:12px;background:var(--red-bg);border:1px solid var(--red-line);border-radius:12px;padding:6px 14px 8px}
  .checkline{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0 0;cursor:pointer}
  .checkline input{width:18px;height:18px;margin-top:3px;accent-color:var(--green);flex:none}

  .donebar{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .donebtn{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:800;cursor:pointer}
  .donebtn[disabled]{background:#C9CCD2;cursor:not-allowed}
  .donebtn.isdone{background:var(--green)}
  .donebar .msg{font-size:13px;color:var(--muted)}

  .outbox{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:20px 22px;margin:22px 0 16px}
  .outbox h2{font-size:18px;margin:0 0 4px;color:var(--ink)}
  .outbox p{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
  .pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
  .pager a{flex:1;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink);font-weight:700}
  .pager a small{display:block;color:var(--faint);font-weight:600;font-size:12px}
  .pager a.next{text-align:right}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:16px}
  .panel h2{font-size:19px;color:var(--ink);margin:0 0 10px}
  .panel p{margin:6px 0}
  .loop3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
  .loop3 div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px}
  .loop3 b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;margin-bottom:4px}
  .loop3 b i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}
  .loop3 span{font-size:13.5px;color:var(--muted)}
  .flowline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
  .flowline a{text-decoration:none;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
  .flowline a b{display:block;font-size:12px;color:var(--red)}
  .flowline a span{display:block;font-weight:700;font-size:13.5px;line-height:1.35;margin:2px 0}
  .flowline a small{color:var(--faint);font-weight:700}
  .note{background:var(--blue-bg);border-radius:12px;padding:12px 16px;font-size:14px;margin:10px 0}
  .note.warn{background:var(--amber-bg)}
  .note b{color:var(--ink)}
  .dlrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .btn{background:#fff;border:1px solid #CFD2D8;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13.5px}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn:hover{filter:brightness(.97)}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px}
  table.t th{text-align:left;background:var(--soft);color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .flow-q{counter-reset:q;list-style:none;padding:0;margin:8px 0}
  .flow-q li{counter-increment:q;position:relative;padding:10px 12px 10px 48px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#fff}
  .flow-q li::before{content:counter(q);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
  .flow-q li small{display:block;color:var(--faint);font-weight:700;font-size:12px}
  .flow-q li .w{color:var(--muted);font-size:13.5px}
  .empty{color:var(--faint);font-size:14px}
  .storewarn{display:none;background:var(--amber-bg);color:var(--amber);font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;margin-bottom:14px}

  .lb{position:fixed;inset:0;background:rgba(10,10,12,.86);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;cursor:zoom-out}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:88vh;border-radius:8px;background:#fff}
  .lb p{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ddd;font-size:13px;margin:0;padding:0 20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:70;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    nav.side{position:fixed;left:0;top:var(--top);width:min(300px,86vw);z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.15)}
    nav.side.open{transform:none}
    .menu-btn{display:inline-block}
    .top .brand small{display:none}
    .prog .txt{font-size:12px}
    main{padding:18px 16px 100px}
    .phead{padding:20px}
    .phead h1{font-size:23px}
    .cbody{padding:0 16px 18px}
    .card > summary{padding:15px 16px}
    .beat{padding-left:0}
    .beat .bn{position:static;display:inline-grid;margin-bottom:4px;width:28px;height:28px;font-size:13px}
    .row,.hook{grid-template-columns:1fr;gap:2px}
    .loop3,.flowline{grid-template-columns:1fr 1fr}
    .top .tbtn.hide-m{display:none}
  }
  @media (max-width:520px){ .loop3{grid-template-columns:1fr} .prog{max-width:none} }
  @media print{
    .top,nav.side,.pager,.donebar,.pbox .copy,.tabs{display:none!important}
    .shell{display:block;padding:0} main{max-width:none;padding:0}
    details{display:block} details > *{display:block}
  }
</style>
</head>
<body>
<header class="top">
  <button class="tbtn menu-btn" id="menuBtn" type="button" aria-label="목차 열기">목차</button>
  <div class="brand">선행연구 분석 실습<small>연세대 BK21 11월 워크숍</small></div>
  <div class="prog" title="완료한 세부 단계 비율"><div class="bar"><i id="progBar"></i></div><span class="txt" id="progTxt">0%</span></div>
  <button class="tbtn hide-m" type="button" data-go="#package">내 기록 내보내기</button>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="교안 목차"></nav>
  <main id="main"></main>
</div>

<script id="content" type="application/json">{"intro": {"lead": "오늘은 학술 DB와 Claude로 선행연구를 따라가며, 내가 정말 궁금한 연구 질문 하나를 찾습니다. Claude가 검색하고 정리하는 동안 나는 고르고, 묻고, 왜 궁금한지 적습니다.", "flowNote": "STEP 2와 3 사이에 10분 쉽니다. 연결 준비(STEP 0) 25분과 마무리 10분을 합쳐 모두 4시간입니다.", "sample": ["각 세부 단계에는 '내 연구용' 프롬프트와 '샘플 주제로 채운 예시'가 함께 있습니다. 샘플 주제는 한강 『채식주의자』의 여러 언어 번역본과 기계 번역·AI 번역 비교입니다.", "샘플은 따라 할 정답이 아닙니다. 같은 프롬프트에 다른 주제를 넣으면 어떻게 바뀌는지, 결과가 어떻게 나오는지 보여 주는 사례입니다. 내 칸에는 내 연구를 적으세요.", "샘플 연구에서 학술 DB 검색은 Claude Code가 Chrome 확장으로 했고, 분석 대화는 claude.ai 웹 화면에서 했습니다. 그래서 캡처 속 Claude 화면은 오늘 쓰는 Code 화면과 모양이 다릅니다."], "remember": [["결정은 내가 합니다", "검색식, 연구 묶음, 핵심 논문, 질문은 내가 고릅니다. Claude는 비교해 줄 뿐 대신 정하지 않습니다."], ["AI 요약을 내 이해로 착각하지 않습니다", "핵심 논문은 내가 먼저 설명하고, Claude는 질문으로 빈틈을 짚습니다."], ["AI 결과는 확인합니다", "학술 DB의 AI 기능과 Claude 모두 틀립니다. 건수·서지·숫자는 DB 화면과 원문으로 봅니다. 'AI가 틀린 곳 모음'에 실제 사례가 있습니다."], ["질문과 이유를 남깁니다", "단계마다 고른 질문과 왜 궁금한지가 쌓여, 마지막에 '내 질문의 흐름'이 됩니다."]]}, "closing": [{"id": "k9_pair", "label": "옆 사람과 짝을 지어 내 핵심 연구 질문과 주장 설계표를 3분씩 설명했다", "hint": "상대가 이해하지 못한 곳이 다듬을 곳입니다."}, {"id": "k9_export", "label": "이 페이지에서 내 기록을 마크다운 파일로 내려받아 작업 폴더에 넣었다", "hint": "브라우저 기록이 지워져도 남도록 파일로 저장합니다."}, {"id": "k9_submit", "label": "연구 질문 패키지 제출 기한과 방법을 확인했다", "hint": "작업 폴더의 산출물, 연구자 노트, AI 활용 기록을 정리해 워크숍 이후 제출합니다. 겨울 심화 과정 우선 선발에 쓰입니다."}], "steps": [{"id": "step0", "num": 0, "title": "시작 준비", "minutes": 25, "oneLine": "Claude Code와 Chrome을 연결하고, 내 작업 폴더를 만들고, Claude가 학술 DB 화면을 읽어 오는지 확인합니다.", "outcome": "Claude와 연결된 내 작업 폴더", "substeps": [{"id": "0-1", "title": "설치와 접속 확인하기", "minutes": 8, "mode": "실습", "why": "Claude가 내 대신 학술 DB를 검색하려면 내 Chrome을 쓸 수 있어야 합니다. 워크숍 전에 미리 해 두면 당일에는 확인만 하면 됩니다.", "itemsTitle": "하나씩 확인하기", "items": [{"id": "k0_plan", "label": "Claude 유료 플랜(Pro 이상) 계정으로 로그인했다", "hint": "무료 플랜, API 키 인증, 다른 회사 클라우드를 거친 계정으로는 Chrome 연결이 되지 않습니다."}, {"id": "k0_app", "label": "Claude 데스크톱 앱을 설치하고 Code 화면을 열었다", "hint": "Windows와 macOS 모두 됩니다. 터미널 명령은 쓰지 않습니다."}, {"id": "k0_ext", "label": "Chrome에 Claude in Chrome 확장을 설치하고, 데스크톱 앱과 같은 계정으로 로그인했다", "hint": "Chrome 웹 스토어의 공식 확장, 1.0.36 이상. 계정이나 조직이 다르면 연결되지 않습니다."}, {"id": "k0_db", "label": "Chrome에서 도서관 교외접속으로 Web of Science, Scopus, DBpia에 들어가 봤다", "hint": "각 DB 첫 화면에 기관 이름이 보이면 됩니다. 로그인은 내가 직접 합니다."}]}, {"id": "0-2", "title": "내 작업 폴더 만들기", "minutes": 7, "mode": "실습", "why": "Claude가 만든 결과와 내 질문이 모두 이 폴더에 파일로 남습니다. CLAUDE.md는 Claude에게 주는 '연구 조교 지침'입니다.", "before": [{"id": "s0_who", "label": "나는 누구인가요", "hint": "전공, 석사·박사, 학기", "type": "short", "sample": "비교문학 석사 2학기"}, {"id": "s0_interest", "label": "요즘 궁금한 현상 한 문장", "hint": "아직 주제가 없어도 됩니다. 넓게 적으세요.", "type": "long", "sample": "한강 소설이 여러 언어로 번역되고, 요즘은 기계 번역·AI 번역도 나오는데 이것들이 어떻게 다른지 궁금하다."}], "files": ["CLAUDE.md", "연구자_노트.md", "AI_활용_기록.md"], "itemsTitle": "폴더 정리하기", "items": [{"id": "k0_folder", "label": "컴퓨터에 내 작업 폴더를 만들고(예: 내연구_홍길동), 세 파일을 넣었다", "hint": "CLAUDE.md에는 위에 적은 내용이 이미 들어가 있습니다."}, {"id": "k0_sub", "label": "작업 폴더 안에 '원문'과 '산출물' 폴더를 만들었다", "hint": "원문 폴더에는 내가 내려받은 논문 PDF를, 산출물 폴더에는 Claude가 만든 결과를 둡니다."}, {"id": "k0_open", "label": "데스크톱 앱 Code 화면에서 이 작업 폴더를 열고 새 세션을 시작했다", "hint": "권한 모드는 기본값(작업마다 묻기)으로 둡니다."}]}, {"id": "0-3", "title": "연결 확인하기", "minutes": 10, "mode": "실습", "why": "Claude가 내 Chrome에서 학술 DB 화면을 읽어 오는지 한 번 확인합니다. 안 되면 지금 강사에게 알리면 됩니다.", "template": "CLAUDE.md를 읽고, 연구 맥락에 빈칸이 있으면 알려 줘.\n그다음 Chrome에서 새 탭을 열어 DBpia 첫 화면으로 가서, 화면 위쪽에 기관 인증 표시가 보이는지 텍스트로 확인해 줘.\n로그인 화면이 나오면 멈추고 나에게 알려 줘.", "aiDoes": "CLAUDE.md를 읽고, 내 Chrome에서 DBpia를 열어 기관 표시를 읽어 옵니다.", "iPick": "사이트 접근 승인 창이 뜨면 학술 DB 사이트만 허용합니다.", "itemsTitle": "결과 확인하기", "items": [{"id": "k0_conn", "label": "Claude가 DBpia 화면의 기관 표시를 읽어 왔다", "hint": "'Browser extension is not connected'가 나오면 확장과 앱의 계정이 같은지 보고, Chrome과 앱을 다시 켭니다. 그래도 안 되면 강사에게 알립니다."}, {"id": "k0_rules", "label": "실습 중 지킬 것을 읽었다", "hint": "Chrome 창은 최소화하지 않습니다. 로그인은 내가 직접 합니다. 검색은 내가 확인한 다음 실행합니다. 원문 PDF는 내가 직접 내려받습니다. 미발표 자료와 개인정보는 폴더에 넣지 않습니다."}]}], "output": {"title": "연결이 안 될 때", "fields": []}}, {"id": "step1", "num": 1, "title": "연구 대상 정하기", "minutes": 20, "oneLine": "막연한 관심을 연구 대상 후보로 바꾸고, 학술 DB 검색 건수를 근거로 하나를 고릅니다.", "outcome": "내 연구 대상 한 문장과 고른 근거(검색 건수)가 담긴 연구 대상 정의서가 남습니다.", "substeps": [{"id": "1-1", "title": "관심을 연구 대상 후보로 바꾸기", "minutes": 8, "mode": "실습", "why": "관심만으로는 검색도 비교도 할 수 없습니다. 무엇을 볼지(연구 대상)와 무엇을 기준으로 견줄지(비교 축)로 나누면 고를 수 있는 후보가 생깁니다.", "before": [{"id": "s1_1_interest", "label": "내 관심", "hint": "궁금한 현상을 한두 문장으로 적습니다. 주제가 안 정해졌으면 넓게 적어도 됩니다.", "type": "long", "sample": "한강 소설이 여러 언어로 번역되고, 요즘은 기계 번역·AI 번역도 나오는데 이것들이 어떻게 다른지 궁금하다."}, {"id": "s1_1_cand", "label": "지금 떠오르는 후보", "hint": "연구해 볼 만한 대상(작품, 집단, 사례 등). 없으면 '아직 없음'", "type": "short", "sample": "아직 없음"}, {"id": "s1_1_lang", "label": "읽을 수 있는 언어와 구할 수 있는 자료", "hint": "내가 읽을 수 있는 언어, 손에 넣을 수 있는 자료를 한 줄로", "type": "short", "sample": "한국어와 영어. 원작 단행본과 영역본은 도서관에서 구할 수 있다."}], "template": "내 관심을 연구할 수 있는 대상 후보로 바꾸고 싶어.\n- 내 관심: {{s1_1_interest}}\n- 지금 떠오르는 후보: {{s1_1_cand}}\n- 읽을 수 있는 언어와 구할 수 있는 자료: {{s1_1_lang}}\n위 세 줄을 연구자_노트.md의 Step 1에 내 문장 그대로 적어 줘.\n그다음 내 관심을 '무엇을 볼지(연구 대상)'와 '무엇을 기준으로 비교할지(비교 축)'로 나눠 후보 표를 만들어 줘.\n열은 후보 대상 | 비교 축 | 필요한 자료 | 구하는 방법 | 예상 어려움 으로 해 줘.\n내가 적은 후보는 꼭 넣고, 네가 더한 후보에는 [추론]을 붙여 줘.\n선행연구 양은 짐작하지 말고, 후보마다 WoS용 영어 검색식과 DBpia용 한국어 검색어만 만들어 줘.\n표와 검색식은 산출물/step1_후보표.md에 저장해 줘.\n끝나면 질문 훅을 보여 줘. (어느 후보가 내 언어와 자료로 실제 해 볼 만한지 가늠하는 방향)", "aiDoes": "내 관심을 연구 대상과 비교 축으로 나눠 후보 표와 후보별 검색식을 만듭니다.", "iPick": "", "check": "내가 적은 후보가 표에 들어갔는지, 선행연구 양을 짐작해 적은 칸이 없는지 봅니다.", "sample": {"promptNote": "샘플은 후보 표와 검색식에 더해 '고를 때 확인할 기준'도 요청했습니다. 이 대화는 Step 2~6을 마친 뒤 새 대화에서 실행해, 지침에 적힌 관심 주제 문구의 영향을 받았을 수 있습니다. 워크숍에서는 이 단계를 가장 먼저 합니다.", "followups": [], "result": ["Claude가 후보 7개를 냈습니다. 원작과 영역본 1종, 다국어 번역본과 중역(다른 언어 번역본을 거쳐 옮긴 번역), 기계 번역(DeepL·Google·Papago), LLM 번역(GPT·Claude·Gemini), 언어 현상 하나에 초점, 간접 번역 경로, 독자·번역가 집단입니다.", "후보는 모두 [추론], 서지는 [확인]으로 표시됐습니다.", "예상 어려움으로 LLM 번역의 데이터 오염(출간 번역본을 이미 학습했을 가능성), 엔진 업데이트로 인한 재현성 저하, 저작권(말뭉치·LLM 입력·인용 분량)이 나왔습니다.", "연구자는 후보 구조만 받아들이고, 작품 선정은 Claude 추정 대신 WoS·DBpia 건수로 하기로 했습니다."], "images": [{"src": "assets/s1_00_claude_candidates.png", "caption": "샘플 수행 당시 Claude 응답(claude.ai 화면). 연구 대상과 비교 축 후보 표의 첫 줄, 원작과 인간 번역본 1종을 비교하는 후보"}], "aiError": {"title": "", "text": ""}, "hooks": ["출간 번역본을 이미 학습했을 가능성(데이터 오염)은 어떻게 확인하고, 연구 설계에서 어떻게 피할 수 있어? (LLM 번역 후보의 예상 어려움에서)", "'이미 연구가 많을 수 있음'이 꼭 불리한 걸까? 쌓인 논쟁이 오히려 출발점이 되는 경우를 알려 줘. (원작과 영역본 후보의 예상 어려움에서)", "내가 읽을 수 있는 언어와 구할 수 있는 자료만으로 실제 해 볼 수 있는 후보는 어느 것이고, 각각 무엇이 모자라? (후보 표의 필요한 자료 열에서)", "후보별 검색식 가운데 다른 뜻의 단어나 다른 분야 문헌이 섞일 위험이 큰 것은 어느 것이야? (후보별 검색식에서)"], "pick": {"question": "선행연구 양은 Claude 추정이 아니라 WoS·DBpia 검색 건수로 확인한다.", "why": "후보 표의 '이미 연구가 많을 수 있음'은 Claude의 추정이어서, 작품 선정은 실제 DB 건수로 판단하기로 했습니다.", "real": true}}}, {"id": "1-2", "title": "검색 건수로 범위 정하기", "minutes": 12, "mode": "실습", "why": "선행연구가 얼마나 쌓였는지는 AI가 짐작하면 틀리기 쉽습니다. 학술 DB에서 직접 센 건수로 견주면 근거를 대며 대상을 고를 수 있습니다.", "before": [{"id": "s1_2_queries", "label": "검색할 후보와 검색식", "hint": "1-1 표에서 고른 후보와 검색식. 고친 곳이 있으면 고친 대로 적습니다.", "type": "long", "sample": "한강 작품 4개(채식주의자, 소년이 온다, 흰, 작별하지 않는다·희랍어 시간)를 견준다. WoS는 TS=(\"Han Kang\" AND Vegetarian)처럼 작가명과 작품명으로 찾고, 번역 연구 전체는 TS=(\"Han Kang\" AND translat*)로 본다. DBpia는 '한강 + 작품명 + 번역'으로 찾는다."}, {"id": "s1_2_bar", "label": "'연구가 쌓여 있다'고 볼 내 기준", "hint": "예: WoS 30건 이상. 감이 없으면 '후보끼리 비교'라고 적습니다.", "type": "short", "sample": "따로 정한 숫자는 없다. 후보끼리 건수를 견주어 가장 많이 쌓인 쪽을 본다."}], "template": "고른 후보의 선행연구 양을 실제 검색 건수로 확인하고 싶어.\n- 검색할 후보와 검색식: {{s1_2_queries}}\n- '연구가 쌓여 있다'고 볼 내 기준: {{s1_2_bar}}\nChrome에서 Web of Science 고급검색과 DBpia를 열어 줘. 검색을 실행하기 전에 검색식을 보여 주고 내 확인을 기다려 줘.\n내가 확인하면 실행해서 DB | 검색식 | 검색일 | 건수 | 상위 5건 제목 을 표로 정리해 줘.\n상위 5건에 다른 분야나 다른 뜻의 문헌이 섞였는지, 철회 표시가 붙은 논문이 있는지도 표시해 줘.\nDB 화면 위쪽에 AI 요약이 있으면 따로 옮기고 '검증 필요'로 표시해 줘.\n내 기준으로 후보를 비교하되, 어느 것을 고를지는 결론 내리지 말고 비교표를 보여 준 뒤 멈춰 줘.\n내가 연구 대상을 고르면 고른 이유를 연구자_노트.md에 내 문장 그대로 적고,\n산출물/step1_연구대상_정의서.md에 연구 대상 | 비교 대상 | 범위 | 제외 | 선정 근거(건수 포함) | 내가 고른 이유 를 저장해 줘.\n끝나면 질문 훅을 보여 줘. (고른 대상에서 아직 비어 있는 연구가 무엇인지 가늠하는 방향)", "aiDoes": "Chrome으로 WoS 고급검색과 DBpia를 검색해 건수와 상위 문헌을 표로 정리합니다.", "iPick": "검색식 실행을 승인하고, 비교표를 본 뒤 연구 대상 하나를 고릅니다.", "check": "표의 건수를 DB 화면 숫자와 직접 맞춰 보고, 고른 대상의 자료를 실제로 구할 수 있는지 확인합니다.", "sample": {"promptNote": "샘플은 작품별 건수 외에 번역 연구 전체를 보는 검색식을 하나 더 넣었습니다. 『채식주의자』만 따옴표 없는 한 단어(Vegetarian)로 검색해서, 61건은 다른 후보보다 넓게 잡힌 값일 수 있습니다.", "followups": [], "result": ["WoS 건수: TS=(\"Han Kang\" AND Vegetarian) 61, TS=(\"Han Kang\" AND \"Human Acts\") 16, TS=(\"Han Kang\" AND \"White Book\") 4, 『작별하지 않는다』·『희랍어 시간』 6. DBpia(한강 + 작품명 + 번역)는 『채식주의자』 57, 『소년이 온다』 27.", "WoS TS=(\"Han Kang\" AND translat*) 16건 중 가장 큰 갈래는 『채식주의자』 영역본(데버라 스미스 번역) 논쟁(5건)이고, 기계 번역·AI 번역 비교는 0건이었습니다. 관련도순 10번째는 2025-11 철회 논문(Kim, M. 2020, 피인용 11)이라 인용 금지 목록에 넣었습니다.", "DBpia에는 『채식주의자』의 독일어·중국어·포르투갈어·이탈리아어·일본어·러시아어 번역 연구가 있었습니다. WoS에서는 보이지 않던 다국어 축입니다.", "연구자는 『채식주의자』를 골랐습니다. 『소년이 온다』는 독역본 기계 번역 비교 연구가 DBpia에 이미 있어 보류, 『흰』과 『작별하지 않는다』·『희랍어 시간』은 선행연구가 적어 제외했습니다."], "images": [{"src": "assets/s1_01_wos_hankang_translat_results.jpg", "caption": "WoS TS=(\"Han Kang\" AND translat*) 16건 중 8·9번. 영역본 번역을 둘러싼 논쟁 논문이 이어지고, 오른쪽에 피인용 수가 보입니다"}, {"src": "assets/s1_02_dbpia_ai_misread.png", "caption": "DBpia '채식주의자 번역' 검색 화면. 위쪽 AI 요약이 작품명을 식습관으로서의 '채식주의자'로 읽고 설명합니다"}], "aiError": {"title": "DBpia AI 요약이 작품명을 식습관으로 읽음", "text": "DBpia에서 '채식주의자 번역'을 검색하자 화면 위 AI 요약이 고기를 뺀 식단 이야기를 했습니다. 작품명을 일반 명사로 읽은 것으로 보여 이 요약은 쓰지 않고 목록을 직접 봤습니다. 다른 뜻이 있는 단어로 검색할 때는 AI 요약보다 결과 목록을 먼저 봅니다."}, "hooks": ["영역본 논쟁 5건은 각각 무엇을 문제 삼았고, 서로 어디서 의견이 갈려? (translat* 16건의 가장 큰 갈래에서)", "기계 번역·AI 번역 비교가 0건인 것은 정말 연구가 없어서일까, 검색식이나 WoS가 싣는 학술지 범위 때문일까? (WoS 0건과 DBpia 결과의 차이에서)", "DBpia에 번역 연구가 있는 언어 가운데 내가 읽을 수 있는 언어로 좁히면 어떤 비교가 가능해? (DBpia 다국어 번역 연구에서)", "61건은 한 단어로 검색해 넓게 잡혔을 수 있어. 다른 후보와 같은 따옴표 방식으로 다시 세면 몇 건이야? (작품별 검색식의 차이에서)"], "pick": {"question": "『채식주의자』를 연구 대상으로 고르고, 원작과 영역본·다국어 번역본·LLM 번역 후보를 열어 둔 채 Step 2로 간다.", "why": "한강 작품 중 선행연구가 가장 많고(WoS 61, DBpia 57), DBpia에 다국어 번역 연구가 있으며, 영역본 논쟁으로 '창의적 번역'이 이미 쟁점이 된 작품이기 때문입니다.", "real": true}}}], "output": {"title": "Step 1 산출물", "fields": [{"id": "o1_target", "label": "내 연구 대상 한 문장", "hint": "무엇을, 무엇과 견주어, 어디까지 볼지 한 문장으로 적습니다. 예: ○○의 △△를 □□와 비교한다", "type": "long"}]}}, {"id": "step2", "num": 2, "title": "연구 지형도 그리기", "minutes": 45, "oneLine": "학술 DB에서 영향력 있는 논문을 모으고, 비슷한 연구끼리 묶어 지도로 정리합니다.", "outcome": "앵커 논문을 찾을 연구 묶음 하나와 앵커 후보 논문 몇 편이 손에 남습니다.", "substeps": [{"id": "2-1", "title": "Research Assistant에 내 질문 던지기", "minutes": 12, "mode": "실습", "why": "WoS Research Assistant(이하 RA)는 Web of Science의 AI 검색 도우미입니다. 내 질문을 검색식으로 바꿔 주는데, 빈틈이 있으면 엉뚱한 논문이 섞입니다. 그래서 검색식은 내가 읽고 확정합니다.", "before": [{"id": "s2_1_q", "label": "RA에 던질 질문", "hint": "내 연구 대상에서 궁금한 것을 한두 문장으로. 한국어로 써도 됩니다", "type": "long", "sample": "한강의 소설 『채식주의자』(The Vegetarian)의 여러 언어 번역본, 그리고 기계 번역·AI(대규모 언어모델) 번역을 비교 분석한 선행 연구에는 어떤 것들이 있나요? 영향력 있는 연구 흐름도 알려주세요."}, {"id": "s2_1_mix", "label": "섞이면 안 되는 다른 뜻", "hint": "내 주제어가 다른 분야에서 다른 뜻으로 쓰이는 경우. 떠오르지 않으면 '모름'", "type": "short", "sample": "작품명 The Vegetarian이 식단의 '채식주의자'와 같은 단어임"}], "template": "Chrome에서 Web of Science의 Research Assistant를 열어 줘.\n내 질문을 고치지 말고 그대로 입력해 줘: {{s2_1_q}}\nRA가 만든 검색식과 근거 문헌(제목·연도·피인용)을 표로 정리해 줘.\n내가 걱정하는 다른 뜻은 이거야: {{s2_1_mix}}\n근거 문헌에 이런 다른 뜻의 논문이 섞였는지 표시해 줘.\n검색식에서 따옴표가 빠진 말이나 너무 넓은 말이 있으면 고친 안을 제안해 줘.\n고친 검색식은 제안만 하고, 다시 실행하기 전에 내 확인을 기다려 줘.\n결과는 산출물/step2_검색결과_WoS.md에 저장해 줘.\n끝나면 질문 훅을 보여 줘. (검색식이 내 질문을 제대로 담았는지 보는 방향)", "aiDoes": "Chrome으로 RA에 내 질문을 넣고, 만들어진 검색식과 근거 문헌을 표로 정리합니다.", "iPick": "RA가 만든 검색식을 그대로 쓸지, 고쳐서 쓸지 내가 정합니다.", "check": "근거 문헌 제목을 하나씩 읽고, 내 주제와 무관한 논문이 섞였는지 봅니다.", "sample": {"promptNote": "샘플에서는 RA의 첫 답을 본 뒤 수정 요청을 한 번 더 보냈습니다. 연구자가 RA 입력창에 검색식 수정과 범위 나누기를 직접 적었습니다.", "followups": [{"text": "검색식을 수정해 주세요. 따옴표 없는 Vegetarian이 식단·영양 논문(3번 문헌)을 끌어오고 있습니다. 작품명은 \"The Vegetarian\"처럼 따옴표로 묶고 \"Han Kang\"과 함께 써 주세요. 또 범위를 두 갈래로 나눠 주세요: (1) 문학 텍스트(소설)의 기계 번역·LLM 번역을 인간 번역과 비교해 품질·창의성을 평가한 연구, (2) 한강 작품의 번역 연구. 먼저 (1)에서 피인용이 높은 기초 연구(seminal papers)를 찾아 주세요.", "why": "근거 문헌 3번이 채식·비건 영양 상담 논문이어서 검색식의 빈틈을 고치려고 보냈습니다."}], "result": ["RA가 만든 검색식: (The Vegetarian OR Han Kang) AND (translation OR \"machine translation\" OR \"neural machine translation\" OR AI OR \"large language model\" OR LLM) AND (comparative analysis OR \"comparative study\" OR \"translation quality\" OR \"literary translation\" OR \"cross-linguistic analysis\")", "RA 요약: 『채식주의자』 자체의 다언어·AI 번역을 직접 비교한 논문은 제한적이고, 시·희곡·고전에서 인간 번역과 기계·LLM 번역을 비교한 흐름이 있다고 답했습니다.", "근거 문헌 3건: Gao et al. (2024) 중국 고전시 기계 번역(피인용 45), Hu & Li (2023) DeepL의 셰익스피어 희곡 번역(피인용 12), Zhou et al. (2026) 채식·비건 영양 상담 LLM 챗봇 연구(무관 문헌).", "검색식을 고친 뒤 범위를 (1) 문학 텍스트의 기계·LLM 번역과 인간 번역 비교 (2) 한강 작품의 번역 연구로 나눠 다시 물었습니다."], "images": [{"src": "assets/s2_01_wos_ra_modes.jpg", "caption": "RA 모드 메뉴. 기본값 Auto 아래에 질문하기, 주제 탐색, 문헌 검토, 학술지 찾기가 있습니다"}, {"src": "assets/s2_02_wos_ra_question_ko.png", "caption": "RA 입력창에 한국어로 질문을 그대로 넣은 모습"}, {"src": "assets/s2_03_wos_ra_search_strategy.png", "caption": "RA가 만든 검색 전략과 검색식. 작품명 The Vegetarian이 따옴표 없이 들어갔습니다"}, {"src": "assets/s2_05_wos_ra_irrelevant_ref.png", "caption": "근거 문헌 3번. 채식·비건 영양 상담에 대한 LLM 챗봇 연구(무관 문헌)"}, {"src": "assets/s2_06_wos_ra_query_fix_request.png", "caption": "연구자의 수정 요청. 작품명 따옴표 처리, 범위 나누기, 기초 연구 요청"}], "aiError": {"title": "따옴표 없는 작품명이 식단 논문을 끌어옴", "text": "RA가 만든 검색식에 작품명 The Vegetarian이 따옴표 없이 들어갔습니다. 그래서 영양학 논문 Zhou et al. (2026, Frontiers in Public Health)이 근거 문헌 3번으로 나왔습니다. 연구자는 근거 문헌 목록에서 이를 확인하고, 작품명을 \"The Vegetarian\"으로 묶고 \"Han Kang\"과 함께 쓰도록 다시 요청했습니다."}, "hooks": ["RA는 『채식주의자』를 직접 비교한 논문이 '제한적'이라고 했다. 범위를 소설 전체로 넓히면 어떤 비교 연구가 나오는가?", "근거 문헌 두 편은 시와 희곡을 다룬다. 장르가 다른 연구의 결론을 소설 번역에 빌려 써도 되는가?", "작품명이 일반 명사와 겹친다면 작가명, 원제, 번역가 이름 중 무엇으로 검색해야 빠지는 논문이 가장 적은가?", "RA가 근거로 든 문헌은 3건뿐이다. 같은 검색식을 고급검색에 넣으면 몇 건이 나오고, RA는 무엇을 기준으로 3건을 골랐는가?"], "pick": {"question": "작품명을 따옴표로 묶어 검색식을 고치고, 범위를 두 갈래로 나눠 문학 텍스트의 기계·LLM 번역 비교부터 기초 연구를 다시 찾는다.", "why": "따옴표 없는 Vegetarian이 식단·영양 논문을 끌어오는 검색식 결함을 확인했기 때문입니다.", "real": true}}}, {"id": "2-2", "title": "영향력 순으로 핵심 논문 모으기", "minutes": 10, "mode": "실습", "why": "피인용(다른 논문에 인용된 횟수)이 많은 논문은 그 분야가 자주 기대는 연구입니다. 피인용 순으로 정렬하면 꼭 볼 논문이 위로 올라옵니다. 공동인용 맵(이 논문과 자주 함께 인용되는 논문 지도)으로 그 주변 연구 묶음도 봅니다.", "before": [{"id": "s2_2_query", "label": "확정한 검색식", "hint": "2-1에서 내가 고쳐 확정한 검색식을 붙여 넣기", "type": "short", "sample": "TS=(\"literary translation\" AND (\"machine translation\" OR \"large language model*\" OR LLM* OR ChatGPT OR GPT*))"}, {"id": "s2_2_expect", "label": "위에 나올 것 같은 연구나 저자", "hint": "짐작으로 한 줄. 떠오르지 않으면 '모름'", "type": "short", "sample": "번역학 학술지에 실린, 사람 번역과 기계 번역을 비교한 연구"}], "template": "Chrome에서 Web of Science 고급검색(Advanced Search)을 열어 줘.\n이 검색식으로 검색할 거야: {{s2_2_query}}\n실행하기 전에 검색식을 보여 주고 내 확인을 기다려 줘.\n확인하면 피인용 높은 순으로 정렬해 상위 20건을 표로 정리해 줘(제목·저자·연도·학술지·피인용).\n내가 예상한 것: {{s2_2_expect}}\n결과가 내 예상과 다른 곳을 짚어 줘.\n다른 분야 논문이나 철회된 논문이 섞였으면 따로 표시해 줘.\n공동인용 맵을 열 논문은 내가 고를 테니, 번호를 묻고 기다려 줘.\n내가 고른 논문을 Research Assistant에서 찾아 Co-citation map을 열고, 함께 인용된 상위 10편을 표로 정리해 줘.\n결과는 산출물/step2_검색결과_WoS.md에 이어서 저장해 줘.\n끝나면 질문 훅을 보여 줘. (어떤 논문이 이 분야의 중심인지 보는 방향)", "aiDoes": "고급검색 결과를 피인용 순으로 정리하고, 내가 고른 논문의 공동인용 맵을 표로 옮깁니다.", "iPick": "공동인용 맵을 열 논문 한 편을 내가 고릅니다.", "check": "피인용 수와 연도를 WoS 화면과 맞춰 봅니다. 공동인용 맵은 그 논문의 참고문헌 목록과 다르다는 점도 기억합니다.", "sample": {"promptNote": "샘플에서는 순서가 반대였습니다. RA가 추천한 기초 연구에서 논문을 골라 공동인용 맵을 먼저 열었습니다. 피인용 정렬은 그 뒤 고급검색에서 했습니다.", "followups": [], "result": ["고급검색 97건을 피인용 순으로 정렬했습니다. 1위 Moorkens, Toral, Castilho & Way (2018) 65, 2위 Guerberof-Arenas & Toral (2022) 59, 3위 Taivalkoski-Shilov (2019) 49. 상위 12편 중 5편이 Translation Spaces 학술지 논문이었습니다.", "연구자 필터 상위: Toral A 6 · Corpas Pastor G 5 · Noriega-Santiáñez L 5 · Way A 4 · Guerberof-Arenas A 3", "Guerberof-Arenas & Toral (2022)의 공동인용 맵: 이 논문을 인용한 59편의 참고문헌 2,755건 중 상위 10편. 1위 Guerberof-Arenas & Toral (2020) 15회, 2위 Toral & Way (2018) 13회, 3·4위 Moorkens et al. (2018)·Kenny & Winters (2020) 각 12회.", "공동인용 상위 10편 중 이 논문의 참고문헌에 실제로 있는 것은 3편뿐이었습니다(원문 참고문헌 p.27–30 대조). 공동인용 맵은 이 논문을 인용한 논문들이 함께 인용한 문헌의 묶음입니다."], "images": [{"src": "assets/s2_09_wos_sorted_by_citations.jpg", "caption": "고급검색 결과를 피인용 순으로 정렬한 화면. 왼쪽 연구자 필터에 Toral, Antonio 6, Guerberof-Arenas, Ana 3이 보입니다"}, {"src": "assets/s2_04_wos_ra_refs_citation_network.jpg", "caption": "RA 근거 문헌 카드. 오른쪽에 피인용(Citations) 수, 아래에 Co-citation map 버튼이 있습니다"}, {"src": "assets/s2_07_wos_cocitation_map_guerberof2022.png", "caption": "Guerberof-Arenas & Toral (2022)의 공동인용 맵. 인용 논문 59편의 참고문헌 2,755건 중 상위 10편"}], "aiError": {"title": "피인용이 높은 다른 분야 논문이 1위로 끼어듦", "text": "RA에 문학 기계 번역의 기초 연구를 묻자, 1위로 Popel et al. (2020)(피인용 213)을 내놓았습니다. 이 논문은 뉴스 번역 연구라 문학 범위 밖입니다. 연구자는 피인용이 높아 끼어든 것으로 판단했습니다. 그래서 평가 방법론 참고용으로만 남겼습니다."}, "hooks": ["공동인용 1위는 같은 저자들의 2020년 논문이다. 2020년 논문과 2022년 논문은 무엇이 이어지고 무엇이 달라졌는가?", "2015–2022년 논문은 인용이 쌓인 시간이 길다. 연평균 피인용으로 다시 줄 세우면 최근 LLM 번역 연구가 위로 올라오는가?", "연구자 필터에서 Toral이 6편으로 가장 많다. 이 연구자 그룹이 쓴 평가 방법을 내 연구 대상에 그대로 쓸 수 있는가?", "피인용 수는 WoS 기준이다. 학회 논문인 Karpinska & Iyyer (2023)를 다른 DB의 피인용으로 다시 보면 순위가 달라지는가?"], "pick": {"question": "공동인용 맵은 Guerberof-Arenas & Toral (2022)로 연다.", "why": "문학(소설)에서 인간 번역·기계 번역·포스트에디팅(기계 번역 결과를 사람이 고치는 작업)의 창의성을 비교한 논문이라 핵심 후보로 봤습니다.", "real": true}}}, {"id": "2-3", "title": "국내 연구 확인하기", "minutes": 10, "mode": "실습", "why": "WoS와 Scopus에는 국내 학술지가 거의 없습니다. 국내 연구는 DBpia에서 한국어로 따로 찾습니다. Scopus AI(Scopus의 AI 요약 도구)는 강사가 보여 주고, 시간이 남으면 직접 해 봅니다.", "before": [{"id": "s2_3_kw", "label": "DBpia에 넣을 한국어 검색어", "hint": "연구 대상과 핵심 개념을 한국어로. 쉼표로 2~4개", "type": "short", "sample": "한강 채식주의자 번역, 문학 기계번역"}, {"id": "s2_3_miss", "label": "WoS에서 빠졌을 것 같은 문헌", "hint": "국내 학술지, 비영어권, 특정 언어권 연구 등 짐작으로 한 줄", "type": "short", "sample": "국내 학술지에 실린 다른 언어 번역본 연구"}], "template": "Chrome에서 DBpia를 열어 줘.\n내가 생각한 검색어는 이거야: {{s2_3_kw}}\nWoS에서 빠졌을 것 같은 문헌: {{s2_3_miss}}\n검색어마다 동의어·표기 변형 후보를 보여 주고, 실행 전에 내 확인을 기다려 줘.\n내가 고른 검색어로 검색해 건수와 상위 20건을 표로 정리해 줘.\n화면 위쪽 AI 요약은 별도 칸에 옮기고, 아래 목록과 맞는지 표시해 줘.\n산출물/step2_검색결과_WoS.md와 겹치는 논문, 국내에만 있는 논문을 나눠 줘.\n(선택) Scopus AI도 쓰면 Chrome에서 Scopus AI를 열어 줘. 2-1의 RA 질문을 영어로 옮겨 보여 주고 내 확인을 기다려 줘.\n결과는 산출물/step2_검색결과_국내_Scopus.md에 저장해 줘.\n끝나면 질문 훅을 보여 줘. (국내 연구가 해외 연구와 어디서 갈라지는지 보는 방향)", "aiDoes": "DBpia 검색어 후보를 내고, 승인한 검색어의 결과를 WoS 결과와 나눠 정리합니다.", "iPick": "실행할 DBpia 검색어와 (선택) Scopus AI 질문을 내가 승인합니다.", "check": "AI 요약의 문장마다 근거 문헌이 실제로 그 내용을 다루는지 확인합니다.", "sample": {"promptNote": "샘플에서는 DBpia 검색어 4개를 썼습니다. 강사 시연에 해당하는 Scopus AI에는 같은 주제를 영어 질문으로 넣었습니다.", "followups": [{"text": "How do machine translation and large language model translations of literary fiction compare with human translations in terms of creativity and translation shifts, and what has been studied about Han Kang's The Vegetarian translations?", "why": "WoS 검색에서 잡히지 않은 문헌이 있는지 교차 확인하려고 Scopus AI에 보냈습니다."}], "result": ["DBpia: '한강 채식주의자 번역' 57건, '문학 기계번역' 202건. 다국어 번역본·중역본 연구, 『소년이 온다』 독역 기계 번역 비교, GPT-4o·Gemini·DeepL 성중립 표현 연구가 나왔습니다.", "Scopus AI(강사 시연): 참고문헌 8편 중 6편이 WoS 검색 결과에 없던 문헌이었습니다. 그중 하나가 Kovalchuk (2019) 『채식주의자』 우크라이나어 간접 번역의 한국 문화 요소 연구입니다.", "간접 번역(중역, 다른 언어 번역본을 거쳐 다시 옮긴 번역)이라는 새 축이 Scopus(우크라이나어)와 DBpia(포르투갈어 중역본·직역본)에서 따로따로 잡혔습니다.", "Scopus AI의 Concept Map은 답변의 1부(기계 번역과 인간 번역 비교)만 담았고, 『채식주의자』·중역 축은 빠졌습니다."], "images": [{"src": "assets/s2_12_dbpia_results.jpg", "caption": "DBpia '한강 채식주의자 번역' 총 57건. 위쪽에 젠더 번역, '그녀'의 번역 가능성을 다룬 논문이 보입니다"}, {"src": "assets/s2_00_scopus_ai_entry.jpg", "caption": "Scopus 첫 화면의 Scopus AI 탭. 연세대학교 학술문화처 도서관 인증으로 들어간 화면"}, {"src": "assets/s2_10_scopus_ai_summary_table.jpg", "caption": "Scopus AI 요약의 비교표와 'Confidence Level: High' 표기. 오른쪽에 Foundational documents"}, {"src": "assets/s2_11_scopus_ai_concept_map.png", "caption": "Scopus AI Concept Map. 기계 번역과 인간 번역 비교만 있고 『채식주의자』·중역 축은 빠졌습니다"}], "aiError": {"title": "'신뢰도 높음' 표시와 맞지 않는 AI 요약", "text": "Scopus AI는 'Confidence Level: High'라고 표시했습니다. 그런데 WoS 피인용 2위 Guerberof-Arenas & Toral (2022)이 참고문헌 8편에 없었습니다. 요약의 '인간 번역이 몰입에서 우위'라는 문장은 근거가 Yin 2024, Yang & Yang 2026이었습니다. Claude가 PDF와 대조해 보니 Guerberof-Arenas & Toral (2022)은 몰입을 측정하지 않았습니다. 그래서 Scopus AI는 교차 확인용으로만 쓰고, 문헌은 목록에서 직접 확인했습니다. DBpia AI 요약도 Step 1에서 작품명을 식습관 이야기로 읽어 쓰지 않았습니다."}, "hooks": ["Scopus와 DBpia에서 따로 잡힌 중역 연구는 어느 언어를 거쳐 번역했는가? 거친 언어에 따라 문화 요소가 빠지는 방식이 달라지는가?", "Scopus AI는 인간 번역이 창의성에서 앞선다고 요약했다. 이 결론과 다른 결과를 낸 연구는 없는가?", "DBpia의 『소년이 온다』 독역 기계 번역 비교 연구는 어떤 방법을 썼는가? 그 방법을 내 연구 대상에 그대로 쓸 수 있는가?", "Scopus AI 참고문헌에만 있던 6편은 정말 WoS에 없는가? 같은 검색식으로 WoS에서 다시 찾으면 확인할 수 있는가?"], "pick": {"question": "간접 번역(중역)을 새 축으로 기록하고, Step 5에서 별도 문헌 검색으로 확인한다. LLM이 영어를 거쳐 번역한다는 주장은 보류한다.", "why": "중역 축은 Scopus(우크라이나어)와 DBpia(포르투갈어)에서 독립적으로 잡혔지만, LLM이 영어를 거친다는 데는 근거가 없었기 때문입니다.", "real": true}}}, {"id": "2-4", "title": "연구 묶음(군집)으로 지도 그리기", "minutes": 13, "mode": "실습", "why": "모은 논문을 주제가 비슷한 것끼리 묶으면 연구 지형이 보입니다. Claude에게 맡기기 전에 내가 먼저 묶어 보면, 내 눈과 AI의 차이가 드러납니다. 앵커 논문(내 연구의 기준이 되는 핵심 논문)을 찾을 묶음은 내가 고릅니다.", "before": [{"id": "s2_4_mine", "label": "내가 먼저 묶어 본 연구 묶음", "hint": "검색 결과를 훑어보고 묶음 이름만 2~4개", "type": "long", "sample": "한강 번역 비평 / 문학 기계·LLM 번역 평가 / 국내 다국어·AI 번역 연구"}, {"id": "s2_4_curious", "label": "가장 궁금한 묶음과 그 이유", "hint": "묶음 이름과 이유 한 줄", "type": "short", "sample": "한강 번역 비평과 문학 기계·LLM 번역 평가. 두 묶음 모두 '창의성'을 축으로 움직이는 것 같아서"}], "template": "산출물/ 폴더의 step2_검색결과 파일을 모두 읽어 줘.\n내가 먼저 묶어 본 연구 묶음은 이거야: {{s2_4_mine}}\n가장 궁금한 묶음과 이유: {{s2_4_curious}}\n네 기준으로 연구 묶음을 다시 나누고, 내 묶음과 다른 곳은 둘 다 보여 주며 차이를 설명해 줘.\n묶음마다 이름, 대표 논문(피인용), 핵심 쟁점, 잡힌 DB를 표로 정리해 줘.\n두 DB 이상에서 겹친 논문과 한 DB에만 있는 논문을 나눠 줘.\n묶음 사이를 잇는 공통 개념(접점)과, DB 수록 범위 때문에 판단을 미뤄야 할 곳도 적어 줘.\n앵커 논문을 찾을 묶음은 내가 고를 테니, 고르기 전에 멈추고 기다려 줘.\n내 선택을 반영해 산출물/step2_연구지형도.md로 저장해 줘.\n끝나면 질문 훅을 보여 줘. (묶음 사이의 접점과 빈 곳을 보는 방향)", "aiDoes": "세 DB 결과 파일을 읽고 연구 묶음, DB 간 중복, 접점, 판단 보류를 표로 정리합니다.", "iPick": "앵커 논문을 찾을 연구 묶음 하나를 내가 고릅니다.", "check": "대표 논문의 피인용 수가 검색 결과 파일과 같은지 봅니다. [추론](Claude가 추론한 내용) 표시가 붙은 문장도 따로 확인합니다.", "sample": {"promptNote": "샘플의 첫 메시지는 Enter 때문에 첫 줄만 전송됐습니다. 그래서 Claude는 묶음 정리보다 앵커 후보 PDF 대조를 먼저 했고, 연구자가 원래 요청을 다시 보냈습니다. 여러 줄을 직접 칠 때는 Shift+Enter로 줄을 바꿉니다.", "followups": [{"text": "설명은 다음 메시지에서 할게. 그 전에 Step 2-B의 원래 요청을 마저 해 줘. 1. 연구 군집으로 묶어 줘 … 2. 두 DB 이상에서 겹친 논문과 한 DB에만 있는 논문 … 3. 영향력이 가장 큰 군집과 접점 … 4. 판단을 보류해야 할 부분", "why": "첫 메시지가 첫 줄만 전송돼, Claude가 묶음 정리 대신 PDF 대조부터 했기 때문입니다."}], "result": ["Claude는 연구자가 처음 묶은 세 묶음을 A~G 일곱 군집으로 나눴습니다. A는 문학 기계 번역(MT)·포스트에디팅과 창의성, D는 『채식주의자』 영역본 논쟁, G는 국내 문학 기계번역입니다.", "WoS 피인용 합계는 A 305 / C 75 / B 61 / D 26 / F 17 / E 7입니다. 단 A는 2015–2022 논문이라 연평균 피인용으로 다시 보는 것이 공정하다고 덧붙였습니다.", "DB 사이에 논문 단위로 겹친 것은 Yoon 2021, Gullander-Drolet 2023 2편뿐이었습니다. 'Scopus가 WoS보다 인문학 커버리지(수록 범위)가 넓다'는 연구자 메모는 판단 보류로 돌렸습니다. 같은 검색식으로 두 DB를 비교한 결과가 없다는 이유입니다.", "접점: '창의성'은 A와 D에서 같은 단어, 다른 뜻입니다. D의 '창의적'은 원문 이탈에 대한 평가이고, A는 수용성과 새로움으로 측정할 수 있게 정한 개념입니다."], "images": [{"src": "assets/s2_13_claude_pdf_crosscheck.png", "caption": "샘플 당시 Claude 응답(claude.ai). 검색 결과 파일을 DB별로 요약하고 PDF 원문과 대조한 표"}, {"src": "assets/s2_14_claude_clusters.png", "caption": "샘플 당시 Claude 응답. 연구 군집 표의 첫 부분(군집 A)"}, {"src": "assets/s2_15_claude_junctions.png", "caption": "샘플 당시 Claude 응답. 군집 사이의 접점 표. 문장마다 [원문]·[추론]을 구분"}, {"src": "assets/s2_08_wos_topicmap_misfire.png", "caption": "WoS RA 토픽 맵 오작동. 문학 기계 번역을 요청했는데 'Example-based machine translation'으로 잡혀 혈액암 노드가 그려졌습니다"}], "aiError": {"title": "AI가 그린 토픽 맵에 혈액암 노드", "text": "지도를 얻으려고 WoS RA에 문학 기계 번역 토픽 맵을 요청했습니다. 첫 요청은 '곧 생성됩니다'라고만 하고 만들지 않았습니다. 검색식을 지정해 다시 요청하자 'Example-based machine translation'으로 잡혀 림프종·골수종 같은 혈액암 노드를 그렸습니다. 약어 EBMT를 혈액·골수이식 학회 이름과 혼동한 것으로 추정합니다. 연구자는 이 맵을 지형도로 쓰지 않고, Claude와 정리한 군집 표로 대신했습니다."}, "hooks": ["A의 창의성 정의(수용성과 새로움)로 D의 『채식주의자』 영역본 논쟁을 다시 분류하면 무엇이 보이는가?", "피인용 합계로는 A(305)가 압도적이다. 연평균 피인용으로 보거나 학회 논문·프리프린트를 넣으면 B(LLM 문학 번역 평가)의 비중이 달라지는가?", "C 군집 6편 중 4편이 중국어로 옮긴 번역을 다룬다. 한국어 원문에서도 같은 결과가 나올지 보려면 어느 군집과 이어야 하는가?", "DB 사이에 겹친 논문이 2편뿐이다. 연구가 정말 적어서인지, 검색식과 DB 수록 범위 때문인지 어떻게 가려낼 수 있는가?"], "pick": {"question": "앵커 논문을 찾을 군집으로 A(문학 MT·창의성)를 고른다.", "why": "A가 피인용 기준으로 영향력의 중심이기 때문입니다. 이 묶음 안에서 앵커 논문을 고르는 일은 Step 3-1에서 합니다.", "real": true}}}], "output": {"title": "Step 2 산출물", "fields": [{"id": "o2_cluster", "label": "내가 고른 연구 묶음", "hint": "묶음 이름과 고른 이유 한 줄", "type": "short"}, {"id": "o2_anchor", "label": "앵커 후보 논문", "hint": "저자·연도·제목으로 1~3편. 피인용 수도 함께", "type": "long"}]}}, {"id": "step3", "num": 3, "title": "핵심 논문 깊이 읽기", "minutes": 45, "oneLine": "내 연구의 기준이 될 핵심 논문 한 편을 고르고, 내 말로 먼저 설명한 뒤 뼈대와 숫자를 원문과 맞춰 봅니다.", "outcome": "쪽수가 달린 논문 뼈대 표, 내가 잘못 이해했던 곳, 숫자 확인표가 담긴 앵커 논문 분석 노트가 남습니다.", "substeps": [{"id": "3-1", "title": "핵심 논문(앵커) 고르기", "minutes": 8, "mode": "실습", "why": "앵커 논문(내 연구의 기준이 되는 핵심 논문)은 남은 Step 내내 기대는 논문입니다. 피인용만 보지 않습니다. 방법을 가져다 쓸 수 있는지, 원문을 구할 수 있는지도 함께 봅니다.", "before": [{"id": "s3_1_criterion", "label": "앵커 논문을 고르는 내 기준", "hint": "피인용 영향력, 내 연구 대상과 가까운가, 방법을 가져다 쓸 수 있는가 가운데 무엇을 앞에 둘지 한 줄로", "type": "short", "sample": "창의성을 재는 방법을 가져다 쓸 수 있는가를 먼저 보고, 피인용 영향력과 원문 공개 여부를 함께 본다."}, {"id": "s3_1_cand", "label": "마음에 둔 후보", "hint": "Step 2에서 적은 앵커 후보의 저자·연도·제목. 없으면 '없음'", "type": "short", "sample": "Guerberof-Arenas & Toral (2022) Creativity in translation"}], "template": "내 연구의 기준이 될 핵심 논문(앵커 논문)을 한 편 고르고 싶어.\n- 내가 고르는 기준: {{s3_1_criterion}}\n- 마음에 둔 후보: {{s3_1_cand}}\n산출물/step2_연구지형도.md에서 후보 3편을 골라 내 기준으로 비교해 줘. 내가 적은 후보는 꼭 넣고, 네가 더한 후보에는 [추론]을 붙여 줘.\n열은 후보 | 피인용 | 내 연구 대상과의 거리 | 가져다 쓸 수 있는 방법 | 원문 구하기 로 해 줘.\n원문 구하기 열은 Chrome에서 각 논문의 DB 상세 화면을 열어 오픈 액세스 표시와 도서관 원문 링크만 확인해 줘.\n화면을 열기 전에 어느 논문을 열지 보여 주고 내 확인을 기다려 줘. 원문은 내려받지 마.\n비교표를 보여 준 뒤 멈춰 줘. 앵커 논문은 내가 골라.\n내가 고르면 고른 이유를 연구자_노트.md에 내 문장 그대로 적어 줘.\n끝나면 질문 훅을 보여 줘. (고른 논문을 읽을 때 무엇을 먼저 볼지 정하는 방향)", "aiDoes": "지형도에서 후보 3편을 내 기준으로 비교하고, Chrome으로 원문을 구할 수 있는지 확인합니다.", "iPick": "앵커 논문 한 편을 내가 고르고, 원문 PDF를 직접 내려받아 원문/ 폴더에 넣습니다.", "check": "고른 논문의 이용 조건(공개 여부, 라이선스)을 확인하고, 내려받은 PDF가 저자 원고인지 출판본인지 봅니다.", "sample": {"promptNote": "샘플에서는 이 비교를 Step 2 지형도 정리 끝에서 했고, 고르는 기준을 미리 적지 않았습니다. 기준 칸의 예시는 샘플 비교표의 열에서 옮겼습니다. Chrome으로 원문 링크를 확인한 기록은 없고, 원문은 arXiv 공개본을 썼습니다.", "followups": [], "result": ["후보 3편을 피인용·연구 대상과의 거리·방법 이식성·원문 접근으로 비교했습니다. Guerberof-Arenas & Toral 2022(WoS 피인용 59, 군집 A 2위)는 문학 번역에서 HT(사람 번역)·PE(기계 번역 결과를 사람이 고친 것)·MT(기계 번역)를 견줍니다. 창의성을 재는 정의와 공식도 있습니다.", "Moorkens et al. 2018은 피인용 65로 군집 A 1위였습니다. 다만 번역가 인식 조사(설문·인터뷰 중심)라 텍스트 분석 틀이 약해 보류했습니다. Kim WD 2018(피인용 13, D 1위)은 『채식주의자』를 직접 다루지만 계량 틀이 없어 참고 문헌으로 뒀습니다.", "고른 논문은 공동인용 맵(이 논문과 자주 함께 인용되는 논문 지도)의 기준 논문이었고, 함께 인용된 상위 10편 중 5편이 군집 A였습니다.", "원문은 arXiv 저자 원고(2204.05655, CC BY-NC-ND 4.0, 31쪽)를 썼습니다. 쪽수가 출판본과 다를 수 있어, 인용할 때는 출판본(Translation Spaces, doi:10.1075/ts.21025.gue) 쪽수로 바꿉니다."], "images": [], "aiError": {"title": "", "text": ""}, "hooks": ["이 논문은 창의성을 새로움과 수용성으로 정의했다고 해. 이 정의를 세울 때 기댄 선행연구는 무엇이고, 참고문헌 어디에 있어? (가져다 쓸 수 있는 방법 열에서)", "피인용은 Moorkens et al. 2018(65)이 더 높아. 번역가 인식 조사인 이 논문을 보조로 함께 읽으면 무엇을 더 볼 수 있어? (보류한 후보에서)", "Kim WD 2018은 『채식주의자』를 직접 다루지만 계량 틀이 없어. 이 논문이 짚은 오역 사례를 앵커 논문의 측정 틀로 다시 볼 수 있어? (참고 문헌으로 둔 후보에서)", "원문은 arXiv 저자 원고야. 출판본과 쪽수나 내용이 다를 수 있다면, 인용하기 전에 무엇을 확인해야 해? (원문 구하기 열에서)"], "pick": {"question": "앵커 논문 1로 Guerberof-Arenas & Toral (2022)을 고르고, Moorkens et al. 2018은 보류, Kim WD 2018은 참고 문헌으로 둔다.", "why": "군집 A의 2위이자 공동인용 맵의 중심 논문이고, 창의성을 재는 정의와 공식이 있으며, 원문이 공개(arXiv, CC BY-NC-ND)되어 있기 때문입니다.", "real": true}}}, {"id": "3-2", "title": "내 말로 먼저 설명하기", "minutes": 14, "mode": "실습", "why": "AI 요약을 먼저 보면 그 요약이 내 이해처럼 느껴집니다. 원문을 훑고 내 말로 먼저 설명하면 내가 모르는 곳이 드러납니다. Claude는 정답 대신 질문으로만 짚습니다.", "before": [{"id": "s3_2_expl", "label": "내 말로 쓴 논문 설명", "hint": "초록·방법·결론을 훑어본 뒤, 논문의 질문·방법·결론을 5~7문장으로. 틀려도 괜찮습니다.", "type": "long", "sample": "이 논문은 창의성을 '새로움'과 '수용성' 두 가지로 정의했다. 새로움은 번역가가 원문과 다르게 옮긴 창의적 전이(creative shift)의 개수로 세었고, 수용성은 독자들이 번역문을 얼마나 즐겁게 읽었는지로 측정했다. 그 결과 HT가 가장 창의적이었고 MT가 가장 낮았으며, PE는 그 중간이었다. 번역가 4명이 보니거트의 단편을 카탈루냐어와 네덜란드어로 번역했다. 결론은 MT를 쓰면 번역가의 창의성이 제약된다는 것이다."}], "template": "원문/ 폴더에 넣은 핵심 논문 PDF를 읽어 줘. 요약이나 정리는 아직 보여 주지 마.\n원문을 읽고 내 말로 먼저 설명해 볼게: {{s3_2_expl}}\n이 설명을 연구자_노트.md의 Step 3에 내 문장 그대로 적어 줘.\n정답은 말하지 말고, 틀렸거나 빠진 곳을 질문으로만 짚어 줘.\n질문마다 내 설명의 어느 문장을 겨누는지, 원문 몇 쪽을 다시 보면 되는지 붙여 줘. 중요한 순서로 놓아 줘.\n원문과 맞는 부분은 '질문 없이 넘어간 부분'으로 따로 알려 줘.\n질문을 보여 준 뒤 멈추고 내 답을 기다려 줘. 어느 질문부터 답할지는 내가 골라.\n내가 다시 답하면 그때 원문 쪽을 들어 맞는지 확인하고 보충해 줘.\n끝나면 질문 훅을 보여 줘. (내가 잘못 이해한 곳이 논문의 결론에 어떤 영향을 주는지 보는 방향)", "aiDoes": "원문을 읽고 내 설명에서 틀렸거나 빠진 곳을 질문으로만 짚습니다. 내가 다시 답하면 원문 쪽을 들어 보충합니다.", "iPick": "어느 질문부터 원문에서 다시 찾아 답할지 내가 고릅니다.", "check": "Claude가 정답을 먼저 말하지 않았는지, 질문에 붙은 쪽에 실제로 그 내용이 있는지 봅니다.", "sample": {"promptNote": "샘플에서는 시연을 위해 설명에 오해 하나를 일부러 넣었습니다. '수용성은 독자들이 번역문을 얼마나 즐겁게 읽었는지로 측정했다'는 문장입니다. 원문은 claude.ai 프로젝트에 PDF로 올려 읽혔습니다.", "followups": [{"text": "1) 수용성 = 검토자 5명(문학 번역가)이 DQF-MQM으로 오류 점수(경미 1·중대 5·치명 15) + Kudos (p.7–8) 2) 즐거움·몰입은 2020 선행 연구와 프로젝트 2축(독자 반응) — 이 논문에선 미측정 (p.1–2, p.4, p.26) 3) CS는 UCP 185개 대비 비율. 공식 (CS/UCP − (오류점수−Kudos)/원문 단어 수)×100, 표 10 검산 6개 중 5개 일치, NL PE 25.7 vs 25 8) 번역가가 해법을 떠올리기 전에 MT 출력을 받아 PE하는 경우로 한정, MT를 사후 대안으로 주는 경우는 모름 (p.26)", "why": "질문 9개 가운데 1·2·3·8번이 가리킨 쪽을 원문에서 다시 읽고 답을 보냈습니다. Claude는 네 답이 모두 원문과 일치한다고 확인한 뒤 보충했습니다."}], "result": ["Claude는 정답을 말하지 않고 질문 9개를 중요도 순으로 냈습니다. 질문마다 겨누는 문장과 다시 볼 쪽을 붙였습니다. 1번은 '번역문을 평가한 사람은 누구였나? 어떤 도구로 무엇을 셌나?'(p.7 Review process, p.8 Acceptability)였습니다.", "두 요소 이름, HT > PE > MT 순서, 단편·언어쌍은 원문과 맞아 '질문 없이 넘어간 부분'으로 따로 알렸습니다.", "연구자는 원문을 다시 읽고 이해를 고쳤습니다. 수용성은 검토자 5명(문학 번역가)이 DQF-MQM(번역 오류를 매기는 기준)으로 낸 오류 점수와 Kudos(오류 점수에서 빼 주는 가산점)로 쟀습니다. 독자의 즐거움·몰입은 이 논문에서 측정하지 않았습니다(p.7–8, p.26).", "Claude 보충: 오류 범주는 8개이고, 검토는 어느 번역인지 모르게(블라인드) 했습니다. 검토자 간 일치도(검토자끼리 판정이 일치한 정도)는 Fleiss Kappa 0.14–0.50(각주 21)이고, NL 검토자는 2명이었습니다."], "images": [{"src": "assets/s3_01_claude_selfcheck_questions.png", "caption": "샘플 수행 당시 Claude 응답(claude.ai 화면). '짚어 볼 질문' 표의 1·2번. 수용성을 독자의 즐거움으로 쓴 문장에 평가한 사람과 측정 위치를 묻고, 다시 볼 쪽을 붙였습니다"}], "aiError": {"title": "", "text": ""}, "hooks": ["수용성은 '오류 점수 − Kudos'로 쟀어. 검토자는 어떤 곳에 Kudos를 줬고, 그 기준은 원문 어디에 적혀 있어? (재답 1과 p.8에서)", "독자의 즐거움은 이 논문에서 재지 않았어. 검토자가 매긴 점수와 실제 독자의 반응이 어긋날 수 있다는 반론에 저자들은 어떻게 답해? (질문 2와 p.26에서)", "『채식주의자』 번역본의 수용성을 잰다면 누가 검토자가 될 수 있어? 이 논문은 문학 번역가 5명이 블라인드로 평가했어. (재답 1과 Claude 보충에서)", "검토자 간 일치도가 Kappa 0.14–0.50으로 낮았어. 이 정도면 수용성 점수를 얼마나 믿을 수 있고, 저자들은 이를 어떻게 다뤘어? (Claude 보충, 각주 21에서)"], "pick": {"question": "수용성은 검토자 5명이 DQF-MQM 오류 점수와 Kudos로 잰 것으로 고쳐 이해하고, 독자의 즐거움·몰입은 이 논문 밖의 후속 과제로 둔다.", "why": "Claude의 질문 1·2번이 가리킨 p.7–8과 p.26을 다시 읽어, 독자 반응은 선행 연구와 후속 과제에서만 다룬다는 것을 확인했기 때문입니다.", "real": true}}}, {"id": "3-3", "title": "논문 뼈대 뜯어보기", "minutes": 11, "mode": "실습", "why": "내 설명을 점검한 뒤에 AI의 정리를 봅니다. 질문·개념·자료·방법·결과·한계로 나누고 쪽수를 붙이면, 인용하거나 내 연구로 옮길 때 원문으로 바로 돌아갈 수 있습니다.", "before": [{"id": "s3_3_unsure", "label": "아직 자신 없는 곳", "hint": "3-2에서 답하지 못한 질문이나 헷갈리는 부분 한 줄", "type": "short", "sample": "창의적 전이를 어떤 유형으로 나눴는지, 두 요소를 어떻게 한 점수로 합쳤는지, MT 점수는 왜 음수인지"}, {"id": "s3_3_take", "label": "내 연구에 가져가고 싶은 부분", "hint": "방법, 개념 정의, 자료 고르는 법 가운데 한 줄", "type": "short", "sample": "창의성을 재는 방법(새로움과 수용성의 정의, 점수 공식)"}], "template": "원문/ 폴더의 핵심 논문을 뼈대별로 뜯어 정리해 줘.\n항목은 연구 질문 | 핵심 개념과 정의 | 자료·참여자 | 방법·계산식 | 주요 결과(숫자 포함) | 저자가 밝힌 한계와 남긴 과제 로 해 줘.\n모든 항목에 원문 쪽·절·표 번호를 붙이고, 원문 표현은 짧게 그대로 옮겨 줘.\nPDF에서 공식이나 표가 깨져 읽히면 짐작해 채우지 말고 '깨짐'이라고 표시해 줘.\n- 아직 자신 없는 곳: {{s3_3_unsure}}\n- 내 연구에 가져가고 싶은 부분: {{s3_3_take}}\n자신 없는 곳은 더 자세히 풀어 주고, 가져가고 싶은 부분은 내 연구로 옮길 때 달라지는 조건을 적어 줘.\n연구자_노트.md의 내 설명(3-2)과 다른 곳은 '처음 설명 | 원문 | 확인한 쪽' 표로 따로 보여 줘.\n결과는 산출물/step3_앵커논문_분석노트.md에 저장해 줘.\n끝나면 질문 훅을 보여 줘. (저자가 '모른다'고 남긴 곳에서 내 연구 질문을 찾는 방향)", "aiDoes": "원문을 질문·개념·자료·방법·결과·한계로 나눠 쪽수와 함께 정리하고, 내 설명과 다른 곳을 표로 보여 줍니다.", "iPick": "", "check": "표의 쪽수 두세 곳을 골라 원문에서 직접 찾아보고, '깨짐' 표시가 있으면 PDF 화면으로 봅니다.", "sample": {"promptNote": "샘플에는 이 정리를 Claude와 주고받은 대화 기록이 남아 있지 않습니다. 아래 결과는 분석 노트의 구조 분해 표에서 옮겼고, 표를 만든 경위는 확인이 필요합니다. '처음 설명과 실제' 표는 3-2 대화 결과로 만들었습니다.", "followups": [], "result": ["연구 질문: 사람이 번역한 텍스트와 기계의 도움으로 만든 텍스트의 창의성을 정량화할 수 있는가, 번역 방식(MT·PE·HT)에 따라 창의성이 다른가(p.4 RQ1, RQ1.1).", "자료·참여자: 커트 보니것 단편 「2BR02B」(2,548단어, 123단락)로, MT 학습 데이터에 없는 텍스트입니다(p.5). 영어→카탈루냐어·네덜란드어, 문학 번역가 4명, 검토자 5명(블라인드)입니다(p.6–7). MT는 소설로 추가 학습한 Transformer NMT이고 LLM이 아닙니다(p.6).", "측정: 창의성 = 새로움 + 수용성(p.8). 새로움은 두 주석자가 표시한 창의적 잠재 단위(UCP, 창의적으로 옮길 여지가 있는 곳) 185개 대비 창의적 전이의 비율입니다. 수용성은 DQF-MQM 오류 점수(경미 1·중대 5·치명 15) − Kudos입니다(p.8–10). 공식은 PDF 추출 때 깨져 표로 복원했습니다(p.10).", "결과와 남긴 과제: 창의성 점수 CA HT 43 · PE 33 · MT −8 / NL HT 41 · PE 25 · MT −7(p.20 표 10). 번역가가 먼저 번역한 뒤 MT를 대안으로 보여 주는 경우와 독자 경험은 모른다고 남겼습니다(p.26). 내 설명과 다른 곳은 수용성의 측정 주체, 전이 개수와 비율, MT 점수의 부호 세 곳이었습니다."], "images": [], "aiError": {"title": "", "text": ""}, "hooks": ["UCP 185개는 두 주석자가 일치한 77개와 불일치한 108개를 합친 거야. 불일치한 곳까지 넣은 이유를 원문에서 찾아 줘. (새로움 측정 항목에서)", "이 논문의 MT는 소설로 추가 학습한 NMT이고 LLM이 아니야. LLM으로 바꿔도 'MT를 먼저 받으면 창의성이 제약된다'는 결론이 유지될 거라고 볼 근거가 있어? (MT 시스템 항목에서)", "원문은 MT 학습 데이터에 없는 텍스트로 골랐어. 『채식주의자』처럼 이미 널리 번역된 작품이라면 이 조건을 어떻게 맞출 수 있어? (자료 항목에서)", "저자들은 번역가가 먼저 번역하고 MT를 대안으로 보는 경우는 모른다고 남겼어. p.26의 그 문장은 정확히 어떤 조건을 걸었어? (저자가 남긴 범위에서)"], "pick": {"question": "이 논문의 MT는 LLM이 아니었다. LLM 번역은 창의적 전이를 더 많이 만들까?", "why": "뼈대에서 이 논문의 MT가 소설로 추가 학습한 NMT이고 LLM이 아니라는 점(p.6)을 확인했기 때문입니다. Claude도 저자들이 '모른다'고 남긴 경우가 연구 질문의 출발점이라고 짚었습니다. 이 메모는 Step 4에서 RQ2가 됐습니다.", "real": true}}}, {"id": "3-4", "title": "핵심 주장·숫자 원문과 맞춰 보기", "minutes": 12, "mode": "실습", "why": "AI가 옮긴 숫자는 원문과 다를 수 있습니다. 결과 숫자를 원문 표의 값으로 다시 계산해 보면 내가 제대로 읽었는지 확인되고, 원문 표의 작은 어긋남까지 보입니다.", "before": [{"id": "s3_4_claim", "label": "다시 확인할 핵심 주장과 숫자", "hint": "논문의 결론을 받치는 숫자나 표 하나. 표 번호를 알면 함께", "type": "short", "sample": "표 10의 창의성 점수 6개(카탈루냐어 HT 43 · PE 33 · MT −8 / 네덜란드어 HT 41 · PE 25 · MT −7)"}, {"id": "s3_4_use", "label": "이 숫자를 내 연구에서 쓰려는 곳", "hint": "비교 기준, 방법 근거, 선행연구 인용 등 한 줄", "type": "short", "sample": "『채식주의자』 번역본에 같은 창의성 공식을 적용할 때 기준으로 삼는다"}], "template": "산출물/step3_앵커논문_분석노트.md에서 숫자가 들어간 문장을 모두 뽑아, 원문과 맞춰 볼 확인표를 만들어 줘.\n열은 문장 | 원문 위치(쪽·표) | 원문 숫자 | 일치 여부 로 하고, 일치 여부 칸은 비워 둬. 내가 원문을 보고 채울게.\n- 다시 확인할 핵심 주장과 숫자: {{s3_4_claim}}\n- 이 숫자를 내 연구에서 쓰려는 곳: {{s3_4_use}}\n핵심 숫자가 원문 표의 값으로 계산된 것이면, 표의 값으로 다시 계산해 원문 숫자와 나란히 보여 줘. 계산식도 적어 줘.\n맞지 않는 곳이 있으면 원인을 [추론]으로 적고, 내가 원문에서 확인할 곳을 짚어 줘. 원인을 채택할지는 내가 정할게.\n내가 쓰려는 곳에 이 숫자를 그대로 써도 되는지, 조건이 다르면 무엇이 다른지 적어 줘.\n확인표와 계산 결과는 분석 노트 끝에 붙여 줘.\n끝나면 질문 훅을 보여 줘. (숫자가 맞지 않는 곳과 내 연구로 옮길 때의 한계를 보는 방향)", "aiDoes": "분석 노트의 숫자를 원문 위치와 함께 확인표로 만들고, 핵심 숫자를 표의 값으로 다시 계산해 어긋난 곳의 원인을 추적합니다.", "iPick": "어긋남의 원인 설명을 원문 표로 직접 확인한 뒤 채택할지 내가 정합니다.", "check": "일치 여부 칸을 원문 표를 보며 직접 채우고, 다시 계산한 값은 계산기나 스프레드시트로 한 번 더 해 봅니다.", "sample": {"promptNote": "샘플에서는 확인표를 따로 요청하지 않았습니다. 연구자가 3-2의 재답에서 표 10을 직접 검산해 '6개 중 5개 일치'를 보냈고, Claude가 이어서 1점 차이의 원인을 추적했습니다. Step 6에서 주장 설계표에 쓴 숫자 3개(UCP 185, 재현 98–139개, Kappa 0.40 미만)도 원문과 다시 맞춰 모두 일치했습니다.", "followups": [], "result": ["PDF에서 창의성 점수 공식이 깨져 있어 표의 값으로 공식을 복원했습니다. 창의성 = (창의적 전이 수 / UCP 수 − (오류 점수 − Kudos) / 원문 단어 수) × 100.", "다시 계산한 값은 CA HT 43.3 · PE 32.7 · MT −8.2 / NL HT 41.0 · PE 25.7 · MT −6.6입니다. 표 10과 6개 중 5개가 맞았고, NL PE만 25.7인데 표는 25였습니다.", "Claude는 반올림·버림 어느 규칙으로도 표 10 전체가 설명되지 않는다고 했습니다. 단서로 표 3의 범주별 오류 점수 합이 Total과 ±1 어긋나는 열이 5개라는 점을 찾아, 검토자 평균을 따로 반올림한 흔적으로 봤습니다. NL 창의적 전이 평균을 62.5(표기 63)로 넣으면 25.42 → 25로 맞습니다.", "연구자가 표 3을 직접 다시 더해 확인했습니다(5개 열 불일치, CA MT만 일치). 또 공식의 두 항은 단위가 달라(UCP당 전이 수, 원문 단어당 오류 점수), 다른 텍스트에 적용한 점수를 이 논문의 43·33·−8과 직접 비교할 수 없다고 정리했습니다."], "images": [{"src": "assets/s3_02_claude_score_recheck.png", "caption": "샘플 수행 당시 Claude 응답(claude.ai 화면). 다시 계산한 값과 표 10을 나란히 놓고, NL PE 1점 차이는 반올림·버림으로 설명되지 않는다고 짚었습니다"}], "aiError": {"title": "", "text": ""}, "hooks": ["논문의 공개 주석 자료로 검토자별 값을 다시 평균 내면, 표 10의 NL PE가 25인지 26인지 확정할 수 있어? (1점 차이 추적에서)", "공식의 두 항은 단위가 달라 0점이 의미 있는 기준선이 아니라고 했어. 그러면 MT의 −8을 '창의성이 없다'는 뜻으로 읽어도 돼? (두 항의 단위 차이에서)", "『채식주의자』처럼 길이와 UCP 밀도가 다른 텍스트끼리 점수를 견주려면, 공식을 어떻게 바꾸거나 무엇을 기준으로 둬야 해? (직접 비교할 수 없다는 정리에서)", "표 3은 'Average error point', 표 7은 'average number'라고 적혀 있어. 다른 표들도 검토자 평균을 반올림해 적은 것인지 원문 어디서 확인할 수 있어? (Claude가 찾은 단서에서)"], "pick": {"question": "Claude의 설명(검토자 평균을 따로 반올림한 흔적)을 채택하고, 이 논문의 점수를 다른 텍스트 점수와 직접 비교하지 않는다.", "why": "표 3을 다시 더해 보니 범주 합과 Total이 5개 열에서 ±1 어긋났고(CA MT만 일치), NL PE를 62.5로 계산하면 25.42 → 25로 표 10과 맞았기 때문입니다.", "real": true}}}], "output": {"title": "Step 3 산출물", "fields": [{"id": "o3_anchor", "label": "앵커 논문", "hint": "저자·연도·제목·학술지. 저자 원고인지 출판본인지도 함께", "type": "short"}, {"id": "o3_oneline", "label": "이 논문을 한 문장으로", "hint": "무엇을, 어떻게 재서, 무엇을 보였는지 내 말로 한 문장. 예: ○○는 △△를 □□로 재서 ◇◇임을 보였다", "type": "long"}]}}, {"id": "step4", "num": 4, "title": "연구 질문 모으기", "minutes": 20, "oneLine": "Step 1~3에서 고른 질문을 한곳에 모아 종류별로 나누고, 먼저 파고들 질문을 내가 정합니다.", "outcome": 멈췄습니다.", "연구자 결정: 1순위 RQ5 + RQ2 결합, 2순위 RQ3, RQ4는 어떤 질문을 고르든 필요한 하위 질문, RQ1·6·7·8은 보류."], "images": [{"src": "assets/s4_02_claude_rq_summary.png", "caption": "Claude가 정리한 요약표(claude.ai 화면). 메모 기호(가~바)와 유형, 영향력·참신성·자료 확보 등급이 함께 보입니다."}], "aiError": {"title": "좁은 범위만 보고 매긴 영향력 '하'", "text": "RQ5의 영향력 '하'는 E 군집(피인용 7)만 본 판단이었습니다. Claude가 스스로 [확인]을 붙였고, 연구자는 판정을 보류한 채 Step 5 재조사 대상으로 넣었습니다. Step 5에서 다시 보니 간접 번역 단독은 '중', LLM 축과 결합하면 '상'으로 바뀌었습니다."}, "hooks": ["RQ5와 RQ2를 합친 질문이라면, 그 안에서 어떤 하위 질문으로 나눠야 하나요? (1순위 결정)", "Claude는 자료 면에서 RQ4·RQ6이 가장 수월하다고 했는데, 실행 가능성을 기준으로 하면 순위가 어떻게 바뀌나요? (Claude 마무리 의견)", "1순위 질문의 '한국어 원문'과 '영어 경유'를 비교하려면, 내가 구할 수 있는 번역본 중 어떤 판본이 필요한가요? (RQ5 자료 확보 중–하)", "RQ5의 영향력 '하'가 E 군집만 본 판단이라면, 간접 번역 분야는 어떤 검색어로 다시 찾아봐야 하나요? (RQ5 [확인] 표시)"], "pick": {"question": "RQ5 + RQ2 결합을 1순위로 두고, RQ5의 영향력은 Step 5에서 다시 확인한다.", "why": "RQ2는 영향력 최상(A·B 군집), RQ5는 참신성 최상이다. 결합하면 영향력 있는 흐름(문학 LLM 번역의 창의성) 안에서 빈틈(한국어 원문, 영어 경유)을 겨눈다.", "real": true}}}], "output": {"title": "Step 산출물", "fields": [{"id": "o4_top", "label": "1순위 질문", "hint": "1순위 질문 한 문장과 고른 이유 한 줄. 질문을 합쳤다면 합친 문장으로", "type": "long"}]}}, {"id": "step5", "num": 5, "title": "질문으로 다시 찾아보기", "minutes": 30, "oneLine": "Step 4에서 고른 1순위 질문으로 학술 DB를 다시 검색합니다. 그 질문에 이미 답한 연구가 있는지 판정합니다.", "outcome": "1순위 질문의 판정(이미 답함 / 일부 답함 / 이 범위에서 확인되지 않음)과 근거 논문 목록이 남습니다.", "substeps": [{"id": "5-1", "title": "질문을 검색식으로 바꿔 다시 검색하기", "minutes": 15, "mode": "실습", "why": "내 질문에 답한 연구가 있는지 보려면 질문에 맞춘 검색식이 필요합니다. AI가 만든 검색식은 다른 분야 논문을 끌어올 수 있습니다. 그래서 실행 전에 내가 식을 확인하고, 실행 뒤에는 결과 목록을 직접 엽니다.", "before": [{"id": "s5_1_rq", "label": "다시 찾아볼 1순위 질문", "hint": "Step 4에서 정한 1순위 질문을 그대로 붙여 넣습니다", "type": "long", "sample": "영어를 거친 중역본과 한국어 직역본의 창의적 전이(원문 표현을 새롭게 옮긴 곳)는 어떻게 다르며, LLM 번역은 어느 쪽에 가까운가 (Step 4의 RQ5 + RQ2 결합)"}, {"id": "s5_1_guess", "label": "이미 답한 연구가 있을 것 같은지, 내 예상", "hint": "있을 것 같다 / 일부만 있을 것 같다 / 없을 것 같다, 그리고 그렇게 생각한 이유 한 줄", "type": "short", "sample": "중역본과 직역본을 비교한 번역학 연구는 있겠지만, LLM 번역까지 셋을 함께 비교한 연구는 없을 것 같다"}, {"id": "s5_1_risk", "label": "다른 분야에서 다른 뜻으로 쓰일 것 같은 단어", "hint": "내 질문 속 단어 가운데 의학·공학 등 다른 분야에서 다른 뜻으로 쓰일 만한 것. 모르겠으면 '모르겠음'", "type": "short", "sample": "translation, novel"}], "template": "내 1순위 질문: {{s5_1_rq}}\n이 질문에 이미 답한 연구가 있을지 내 예상: {{s5_1_guess}}\n다른 분야에서 다른 뜻으로 쓰일 것 같은 단어: {{s5_1_risk}}\n\n1. 이 질문을 검색식으로 바꿔 줘. Web of Science 고급검색 식(TS=…)과 DBpia 한국어 검색어를 각각 만들고, 동의어와 표기 변형도 넣어 줘.\n2. 다른 분야에서 다른 뜻으로 쓰이는 단어가 있으면 경고해 줘. 내가 적은 단어도 함께 점검해 줘.\n3. 검색식을 보여 주고 멈춰. 내가 승인한 식만 실행해 줘.\n4. 승인하면 Chrome에서 Web of Science, Scopus, DBpia를 열어 실행하고, DB별 건수와 상위 20건을 정리해 줘.\n5. 상위 20건 가운데 다른 분야 문헌이 몇 건 섞였는지 세어 표시해 줘.\n6. 결과를 산출물/step5_검색결과.md에 저장해 줘.\n끝나면 질문 훅을 보여 줘. (검색 결과가 내 예상과 달랐던 곳 중심으로)", "aiDoes": "질문을 DB별 검색식으로 바꾸고, 내가 승인한 식만 Chrome에서 실행해 건수와 상위 문헌을 정리합니다.", "iPick": "검색식을 실행해도 되는지 내가 승인합니다. 고칠 단어가 있으면 고친 뒤 승인합니다.", "check": "결과 목록 상위를 직접 열어 내 분야가 아닌 논문이 섞였는지 봅니다. 건수가 예상보다 훨씬 크면 특히 의심합니다.", "sample": {"promptNote": "샘플에서는 Claude가 질문 하나를 여러 갈래의 검색식으로 나눴습니다. 간접 번역(중역), 간접 번역 × 기계번역·LLM × 문학, LLM의 영어 중심성 등입니다. '문학까지 묶은 식이 0~5건이면 문학 조건을 빼고 다시 실행하라'는 조건도 붙였습니다. 샘플의 분석 대화는 claude.ai에서 했고, 검색 결과는 Chrome에서 확인해 대화에 전달했습니다.", "followups": [{"text": "WoS·Scopus·DBpia 실행 결과(건수, 상위 문헌)를 Claude에 전달하면서, 간접 번역 식(a-1) 결과 2,456건 중 2,126건이 mRNA·protein·cell 등과 함께 나온다고 알림", "why": "건수가 너무 커서 결과 목록을 직접 확인했더니 생물학 논문이 대부분이었기 때문"}], "result": ["Claude가 만든 간접 번역 식(a-1)은 WoS에서 2,456건이었습니다. 그중 2,126건이 생물학의 '번역'(단백질 합성) 논문으로, 약 87%가 섞였습니다.", "Claude가 '인문학 쪽만 보기'로 만든 식(a-2)은 3,280건으로 오히려 늘었습니다. 기계번역을 빼는 조건만으로는 생물학 논문이 걸러지지 않았습니다.", "연구자가 literar*·translator*·\"translation studies\" 같은 단어로 범위를 좁힌 식은 WoS 136건, Scopus 175건이었습니다. Scopus 피인용(다른 논문에 인용된 횟수) 상위는 St. André 2010 (30), Marin-Lacarta 2017 (29), Pięta 2012 (26)입니다.", "간접 번역 × MT·LLM × 문학은 WoS 6건, Scopus 5건으로 거의 비어 있었습니다. Scopus에서 gpt-4*처럼 하이픈과 별표(*)를 함께 쓰면 0건 오류가 나서 gpt로 고쳤습니다."], "images": [{"src": "assets/s5_01_claude_query_error_ack.png", "caption": "실행 결과를 전하자 Claude가 자기 검색식의 오류(생물학 혼입을 경고하지 못함)를 먼저 인정한 응답"}, {"src": "assets/s5_02_scopus_indirect_top_cit 국어 추가 항목, 앵커 1 점수와 직접 비교 금지) / 평가자(포르투갈어 검토자)", "하위 질문은 SQ1 간접성 판정부터 SQ6 LLM 오류까지 나눴습니다. 대부분의 하위 질문에 기준 문헌(Marin-Lacarta 2017, 이지현 2025, Wendler 2024, Guerreiro 2023 등)을 붙였습니다."], "images": [{"src": "assets/s6_01_claude_core_rq.png", "caption": "Claude가 제안한 한 문장 연구 질문. '물려받은 전이' 절을 덧붙인 이유를 밝히고, 넣을지는 연구자에게 넘김"}], "aiError": {"title": "", "text": ""}, "hooks": ["중역본의 전이가 영역본에서 '물려받은' 것인지 우연히 같은 것인지는 무엇으로 가려낼 수 있나요?", "LLM이 『채식주의자』와 영역본을 이미 학습했다면, 중역본과 닮은 결과가 영어 경유 때문인지 기억 때문인지 어떻게 구분하나요?", "적용 범위를 텍스트·인간 번역·LLM·측정·평가자로 나눈 방식을 내 질문에 대입하면, 어느 칸이 아직 비어 있나요?", "측정에서 '앵커 1 점수와 직접 비교 금지'라고 한 근거를 Step 3 검산 기록에서 다시 확인할 수 있을까요?"], "pick": {"question": "Claude가 제안한 문장을 받아들이고 '물려받은 전이' 절을 넣었다. 검증 가설 H1·H2는 연구자가 직접 썼다.", "why": "'물려받은 전이' 절은 Claude가 판단을 넘겼고, 넣을지는 연구자가 정했다. 포르투갈어로 한정한 것은 중역본·직역본이 함께 있는 번역본 세 종이 있어서다(임소라·성효정 2024).", "real": true}}}, {"id": "6-2", "title": "두 번째 기준 논문(앵커 2) 찾기", "minutes": 10, "mode": "실습", "why": "앵커 1(내 연구의 기준이 되는 핵심 논문)이 모든 기준을 주지는 않습니다. 핵심 질문을 세우고 나면 앵커 1로 정할 수 없는 기준이 보입니다. 그 빈자리를 채울 두 번째 기준 논문을 고릅니다.", "before": [{"id": "s6_2_gap", "label": "앵커 1이 채워 주지 못하는 것", "hint": "앵커 1로는 정할 수 없는 기준이나 방법 한 줄", "type": "short", "sample": "어떤 번역본을 영어를 거친 중역본으로 볼지 판정하는 기준과 자료"}, {"id": "s6_2_cand", "label": "떠오르는 후보 논문", "hint": "지금까지 본 논문 가운데 있으면 적습니다. 없으면 '없음'", "type": "short", "sample": "Step 5 간접 번역 검색에서 본 Marin-Lacarta 2017"}], "template": "앵커 1이 채워 주지 못하는 것: {{s6_2_gap}}\n지금 떠오르는 후보 논문: {{s6_2_cand}}\n1. 연구자_노트.md에서 내가 확정한 핵심 질문과 앵커 1 기록을 읽어 줘.\n2. 위 빈자리를 채울 논문을 찾는 검색식을 만들어 보여 줘. 내 확인을 기다렸다가 Chrome에서 Web of Science와 Scopus를 열어 실행해 줘.\n3. 내 후보와 검색 결과를 합쳐 후보 2~3편을 표로 비교해 줘. 칸: 서지·피인용 / 이 연구에서 맡을 일 / 앵커 1과 겹치는지 보완하는지 / 석사과정이 따라 할 수 있는지\n4. 초록만 근거로 써 줘. 원문은 내가 나중에 직접 내려받아 확인할게.\n5. 추천은 해도 되지만 앵커 2는 내가 고를게.\n끝나면 질문 훅을 보여 줘. (두 앵커가 서로 부딪히는 곳과 원문에서 확인할 것을 짚는 방향)", "aiDoes": "검색식을 보여 주고, 내 확인 뒤 Chrome에서 검색해 후보를 표로 비교합니다.", "iPick": "검색식 실행 여부와 앵커 2는 내가 정합니다.", "check": "고른 논문의 초록에 '맡을 일'이 실제로 있는지 봅니다. 원문 확인은 워크숍 뒤 과제로 연구자_노트.md에 적습니다.", "sample": {"promptNote": "샘플에서는 새로 검색하지 않았습니다. Step 5 검색 결과에 있던 후보 세 편을 비교했습니다.", "followups": [], "result": ["Marin-Lacarta 2017(Translation Studies 10(2), Scopus 피인용 29): 간접성 판정·기록의 자료원과 방법을 줌 → SQ1. 앵커 1과 보완 관계(앵커 1은 무엇을 셀지, 이 논문은 무엇을 중역으로 볼지). 석사 재현 가능성 높음.", "Wendler et al. 2024(ACL, Scopus 피인용 114): LLM 영어 경유 가설의 근거 → SQ5. 모델 내부 표상(모델 안에서 말을 처리하는 방식)을 다룬 연구라 앵커 1과 층위가 다릅니다. 번역 출력과 잇는 추론 단계가 필요하고 재현 가능성 낮음. 이지현 2025(인문학연구 44, 피인용 미집계): 가장 가까운 선행 설계 → SQ2·SQ3, 재현 가능성 높음.", "Claude 추천: 앵커 2 = Marin-Lacarta 2017. 간접성을 확정하지 못하면 SQ3·SQ4가 성립하지 않는다는 이유입니다. Wendler 2024는 가설 근거로, 이지현 2025는 차별점 기준으로 인용합니다.", "Claude가 짚은 두 앵커의 긴장: 앵커 1의 '원문에서의 이탈'은 원문이 하나라고 전제합니다. 앵커 2의 관점에서는 원문이 둘(한국어 원문, 영어 매개 텍스트)입니다. SQ4가 이 긴장을 다루는 자리이자 방법론적 기여가 됩니다."], "images": [], "aiError": {"title": "", "text": ""}, "hooks": ["원문이 하나인가 둘인가 하는 두 앵커의 긴장을 연구 설계에서 실제로 어떻게 풀 수 있나요?", "가장 가까운 선행 연구인 이지현 2025를 앵커 2로 삼으면 연구 설계가 어떻게 달라지나요?", "Marin-Lacarta 2017의 판정 자료원(서지, 서문·표지 같은 파라텍스트, 번역 비교)을 포르투갈어 번역본 세 종에 대입하면 지금 바로 확인할 수 있는 것은 무엇인가요?", "앵커 2는 초록으로만 역할을 확인했습니다. 원문의 어느 부분에서 판정 방법을 확인해야 하나요?"], "pick": {"question": "앵커 2 = Marin-Lacarta 2017", "why": "Claude 추천과 연구자의 독립 판단이 일치했다. 무엇을 중역으로 볼지 먼저 정해야 중역본과 직역본 비교가 성립한다.", "real": true}}}, {"id": "6-3", "title": "주장 설계표 채우기", "minutes": 13, "mode": "실습", "why": "주장 설계표(정식 이름: FOL 스켈레톤)는 무엇을 어디까지 주장할지 미리 적는 표입니다. 결과가 나온 뒤 주장이 슬쩍 커지는 것을 막아 줍니다. 오늘은 주장 하나를 골라 한국어로 표를 채웁니다. 기호 표기는 Claude가 초안을 만들고, 겨울 과정에서 완성합니다.", "before": [{"id": "s6_3_target", "label": "대상", "hint": "무엇과 무엇을 비교하나요? 셀 수 있게 목록으로 적습니다. 예: 자료 세 종, 집단 두 개", "type": "long", "sample": "포르투갈어 출판 번역본 세 종(중역본·직역본으로 판정해 나눔), LLM 세 종(claude, gpt, gemini)의 번역 각 5회(한국어 직접 입력, 점검용 영역본 입력), 원문 발췌에 표시한 창의적 잠재 단위(UCP)"}, {"id": "s6_3_judge", "label": "무엇으로 판정하나", "hint": "누가 어떤 자료를 보고 '그렇다/아니다'를 정하나요?", "type": "long", "sample": "두 번역이 같은 단위에서 같은 해법을 골랐는지는 검토자 과반 판정(블라인드)으로, 중역·직역 여부는 서지·파라텍스트(서문·표지 문구 등)·텍스트 비교 기록으로 판정"}, {"id": "s6_3_claim", "label": "주장과 범위", "hint": "주장 한 문장 + 어디까지(모두 / 과반 / 하나 이상 / 조건이 맞을 때만)", "type": "long", "sample": "과반 모델에서, LLM의 한국어 직접 번역은 직역본보다 중역본과 더 자주 일치한다. 중역본과 직역본이 서로 다르게 처리한 단위에서만 비교하고, 측정 도구 점검(C0)을 통과했을 때만 해석한다. 범위는 『채식주의자』 발췌, 고정한 모델·버전·프롬프트, 5회 생성"}, {"id": "s6_3_nonclaim", "label": "주장하지 않는 것", "hint": "읽는 사람이 내 주장을 넘겨짚기 쉬운 더 큰 주장", "type": "short", "sample": "LLM이 내부적으로 영어를 거쳐 번역한다 / 일치하면 좋은 번역이다 / 다른 모델·작품·언어에도 같은 결과가 나온다"}, {"id": "s6_3_kill", "label": "주장을 접는 조건", "hint": "이런 결과가 나오면 이 주장을 포기한다", "type": "long", "sample": "방향이 반대이거나 과반 모델에서 유의하지 않을 때, 비교할 단위가 30개(잠정)보다 적을 때, 출판 번역본과 겹치는 단위를 빼자 효과가 사라질 때"}], "template": "내가 채운 주장 설계표야. 주장 하나를 골라 적었어.\n- 대상: {{s6_3_target}}\n- 무엇으로 판정하나: {{s6_3_judge}}\n- 주장과 범위: {{s6_3_claim}}\n- 주장하지 않는 것: {{s6_3_nonclaim}}\n- 주장을 접는 조건: {{s6_3_kill}}\n1. 이 표를 연구자_노트.md의 6-3 칸에 내 문장 그대로 적어 줘.\n2. 칸마다 빠졌거나 모호한 곳을 질문으로 먼저 짚어 줘. 특히 '무엇으로 판정하나'에 실제로 모을 수 있는 자료가 적혔는지 봐 줘.\n3. 내가 답한 뒤, 이 표를 기호 표기(FOL 스켈레톤) 초안으로 옮겨 산출물/주장설계표.md에 표와 함께 저장해 줘. 기호마다 한국어 뜻을 옆에 달고, 네가 덧붙인 부분은 [추론]으로 표시해 줘.\n4. 내 표와 초안이 어긋나는 곳을 따로 적어 줘. 어느 쪽으로 맞출지는 내가 정할게.\n끝나면 질문 훅을 보여 줘. (주장이 저절로 참이 되는 곳, 반론을 막는 칸, 판정 자료가 약한 곳을 짚는 방향)", "aiDoes": "내 표의 빈 곳을 질문으로 짚고, 표를 기호 표기 초안으로 옮겨 저장합니다.", "iPick": "내 표와 기호 초안이 어긋난 곳을 어느 쪽으로 맞출지 내가 정합니다.", "check": "'무엇으로 판정하나' 칸마다 실제로 모을 자료가 있는지, 초안의 주장 범위가 내 표보다 커지지 않았는지 봅니다.", "sample": {"promptNote": "샘플 기록에는 한국어 표가 따로 남아 있지 않습니다. 연구자가 검증 가설 H1·H2 문장과 결정 사항을 보내고 기호 초안을 바로 받았습니다. 위 칸 값은 확정된 스켈레톤에서 H1 주장 하나를 표로 옮긴 것입니다.", "followups": [], "result": ["Claude가 먼저 짚은 함정: 앵커 1에서 UCP 185개 중 98–139개가 재현(원문을 그대로 옮김)이었습니다(p.18 표 7). 처리 유형만 같은지 보면 대부분 '둘 다 재현'으로 일치해, 검증 가설 H1이 거의 자동으로 참이 되거나 판별력을 잃습니다. 그래서 '일치'를 '해법이 같은 선택'(검토자 판정)으로 정의하고, 중역본과 직역본이 서로 다르게 처리한 UCP(판별 집합)에서만 비교했습니다.", "기호 초안은 Signature(대상 목록)부터 Kill criteria(주장을 접는 조건)까지 나왔습니다. 초안에서 비어 있던 LLM 집합 {m1, …, mk}와 회차 {1, …, s}를 연구자가 {claude, gpt, gemini}와 5회(잠정)로 고정했습니다.", "스켈레톤은 측정 도구 점검 C0을 맨 앞에 둡니다. 영역본을 직접 받은 LLM 번역조차 중역본 쪽으로 기울지 않으면, 원인을 가리기 전까지 H1을 해석하지 않습니다.", "H2-C(중역본 전이 중 영역본에서 물려받은 것의 비율이 직역본의 우연 일치 비율보다 높다)는 Claude 초안에 없던 주장입니다. 연구자가 주 주장으로 채택했고, 처음 제안한 경위는 기록에 없습니다. 주장을 접는 조건은 확정본에서 K1~K10이 되었습니다."], "images": [{"src": "assets/s6_02_claude_h1_disc.png", "caption": "Claude가 짚은 함정. UCP 185개 중 98–139개가 재현이라 '일치'를 같은 해법 선택으로 정의하고 판별 집합에서만 비교"}, {"src": "assets/s6_03_claude_fol_signature.png", "caption": "기호 초안의 Signature(대상 목록). LLM 집합이 m1, …, mk로 비어 있어 연구자가 claude·gpt·gemini로 고정"}, {"src": "assets/s6_04_claude_fol_claims.png", "caption": "Claims 초안의 H1과 H1-S. H1-S 식은 '조건 → 결과' 형태라 검토에서 고침"}, {"src": "assets/s6_05_claude_fol_kill.png", "caption": "Kill criteria 초안(K1~K3). K2가 접는 주장은 H2, A9뿐이었고 확정본에서 C0·H2-C가 더해짐"}], "aiError": {"title": "범위를 건 주장이 저절로 참이 되는 식", "text": "H1-S(오염 가능성을 뺀 범위에서 다시 세는 H1) 초안은 '오염 위험이 없는 모델이면 → 중역본과 더 일치한다'는 형태였습니다. 오염은 모델이 영역본이나 번역본을 이미 학습했을 가능성을 말합니다. 이런 식은 조건을 만족하지 않는 모델도 참으로 셉니다. 평가 전 검토(cycle 0)에서 조건을 만족하는 모델만 모아 그 안에서 과반을 세도록 고쳤습니다. 그런 모델이 없으면 '해당 없음'으로 기록합니다."}, "hooks": ["판별 집합에서만 비교하면 단위가 30개(잠정)에 못 미칠 수 있습니다. 그때는 발췌를 늘려야 하나요, 탐색적 관찰로만 보고해야 하나요?", "LLM이 출판 번역본을 이미 기억하고 있어서 중역본과 닮았다면, 이 표의 어느 칸이 그 반론을 막고 있나요?", "H2-C처럼 '우연히 같은 경우'를 기준선으로 두고 비교하는 방식을 내 연구 대상에도 쓸 수 있을까요?", "'같은 해법 선택'은 검토자가 판정합니다. 검토자 간 일치도(kappa)가 0.40보다 낮으면 결과를 어떻게 보고해야 하나요?"], "pick": {"question": "H2-C(물려받은 전이 비율을 직역본의 우연 일치 비율과 비교)를 주 주장으로 채택했다.", "why": "중역본과 영역본이 같은 전이를 보여도 우연일 수 있다. 우연 일치 기준선이 필요하다는 연구자 결정이다.", "real": true}}}], "output": {"title": "Step 6 산출물", "fields": [{"id": "o6_rq", "label": "핵심 연구 질문", "hint": "내가 최종으로 정한 문장 그대로", "type": "long"}, {"id": "o6_anchor2", "label": "앵커 논문 2", "hint": "저자·연도·제목과 이 연구에서 맡는 일 한 줄", "type": "short"}, {"id": "o6_table", "label": "주장 설계표 요약", "hint": "대상 / 무엇으로 판정하나 / 주장과 범위 / 주장하지 않는 것 / 주장을 접는 조건을 한 줄씩", "type": "long"}]}}]}</script>
<script id="files" type="application/json">{"CLAUDE.md": "# 연구 조교 지침\n\n> 이 파일은 작업 폴더 맨 위에 둔다. Claude Code는 폴더를 열 때 이 파일을 먼저 읽고 지침으로 삼는다.\n> `{ }` 부분만 본인 연구에 맞게 바꾼다. 나머지 원칙은 바꾸지 않는다.\n\n## 역할\n\n- 너는 나의 연구 조교다. 연구의 판단과 결정은 내가 한다.\n- 너는 Chrome으로 학술 DB를 검색해 결과를 모으고, 자료를 정리하고, 내 이해를 점검하고, 근거를 원문과 대조하는 일을 돕는다.\n\n## 연구 맥락\n\n- 연구자: {전공 / 석사·박사 / 학기}\n- 관심 현상: {한 문장. 아직 연구 주제가 정해지지 않았으면 넓게 적는다}\n- 사용하는 학술 DB: Web of Science(Research Assistant 포함), Scopus(Scopus AI 포함), DBpia\n- 학술 DB 접속: 연세대 도서관 교외접속 인증으로 내가 직접 로그인한 Chrome\n\n## 폴더 구성\n\n| 위치 | 내용 | 누가 쓰는가 |\n|---|---|---|\n| `연구자_노트.md` | 세부 단계마다 내가 먼저 적은 것, 내가 고른 것, 질문 훅에서 고른 질문과 왜 궁금한지 | 내 문장을 네가 그대로 옮겨 적는다 |\n| `AI_활용_기록.md` | 단계별로 맡긴 일, 네가 낸 결과, 내가 확인한 것 | 네 칸은 네가, 내 칸은 내가 쓴다 |\n| `원문/` | 핵심 논문 원문 PDF | 내가 직접 내려받아 넣는다 |\n| `산출물/` | 단계별 결과 문서 | 네가 저장하고, 내가 확인한다 |\n\n## 진행 방식\n\n1. **먼저 적기**\n   - 프롬프트에 `{ }`가 그대로 남아 있거나 내 칸이 비어 있으면 작업을 시작하지 않는다. 그 칸만 다시 묻고 기다린다. 내 생각을 네가 대신 채우지 않는다.\n   - 내가 먼저 적은 내용은 작업 전에 `연구자_노트.md`의 해당 세부 단계 칸에 그대로 적는다.\n2. **내가 고르기**\n   - 프롬프트에 \"내 확인을 기다려 줘\"가 있으면 거기까지의 결과를 보여 주고 멈춘다.\n   - 검색식, 연구 묶음, 핵심 논문, 질문 우선순위, 핵심 연구 질문은 내가 정한다. 선택지를 비교해 줄 수는 있지만 결론을 내리지 않는다.\n   - 내가 결정을 보내면 결정과 이유를 `연구자_노트.md`에 내 문장 그대로 적는다. 이유가 없으면 한 번 묻는다.\n3. **질문 훅**\n   - 분석이나 검색 결과를 보여 준 뒤에는 항상 '이어서 물어볼 질문' 4개를 번호로 제시한다.\n   - 네 질문은 방향이 서로 달라야 한다: ① 더 깊이 파기 ② 다른 관점·반론 ③ 내 연구 대상에 적용 ④ 근거·방법 확인. 질문마다 어느 결과에서 나왔는지 짧게 붙인다.\n   - 프롬프트 마지막 줄 괄호에 방향이 적혀 있으면 그 방향을 반드시 넣는다.\n   - 그다음 이렇게 묻는다: \"이 중 하나를 고르거나 직접 질문을 써 주세요. 왜 그게 궁금한지도 한 줄로 적어 주세요.\"\n   - 내 답을 받으면 `연구자_노트.md`에 질문과 이유를 내 문장 그대로 적고, 그 질문에 짧게 답하거나 다음 작업에서 이어 간다. 이유가 없으면 한 번 더 묻는다.\n4. **질문 이어 가기**\n   - 새 Step을 시작할 때 `연구자_노트.md`에 쌓인 내 질문을 읽고, 이번 Step에서 다룰 수 있는 질문을 먼저 알려 준다.\n\n## 브라우저 사용 원칙\n\n1. **사용할 브라우저**: 학술 DB 작업은 Claude in Chrome 확장으로 내가 로그인한 Chrome에서 한다. 앱 내장 브라우저는 기관 인증이 없으므로 쓰지 않는다.\n2. **로그인·인증**: 로그인, 교외접속 인증, CAPTCHA, 이용 약관 동의 화면이 나오면 멈추고 내가 처리하기를 기다린다. 계정 정보를 입력하거나 저장하지 않는다.\n3. **검색 실행**: 검색을 실행하기 전에 검색식을 보여 주고 내 확인을 받는다. 실행한 검색식, DB, 날짜, 결과 건수를 함께 기록한다.\n4. **결과 수집**: 화면에 보이는 결과를 상위 {20}건 안에서 읽는다. 전체 목록을 페이지마다 넘기며 모으거나 원문 PDF를 일괄로 내려받지 않는다. 원문은 내가 직접 내려받는다.\n5. **화면 읽기**: 텍스트 읽기를 먼저 쓰고, 스크린샷은 지도·그래프처럼 글로 읽을 수 없는 화면에만 쓴다. 화면이 비어 있거나 이전 화면에 멈춰 있으면 결과가 0건이라고 판단하지 말고 나에게 알린다.\n6. **학술 DB의 AI 기능**: WoS Research Assistant, Scopus AI, DBpia AI 요약이 낸 결과는 검증 대상으로 다룬다. 근거 문헌 목록과 실제 검색 결과를 대조해 엉뚱한 문헌이 섞였는지 표시한다.\n\n## 근거와 표기\n\n- 논문 내용을 말할 때는 근거 위치(파일명·쪽·절·표 번호, 또는 DB·검색식·화면)를 함께 적는다.\n- 확인하지 못한 서지 정보와 수치는 \"확인 필요\"로 표시하고, 기억에 의존해 만들어 내지 않는다.\n- 문장마다 성격을 구분한다: `[원문]` 원문이나 DB 화면에 있는 내용 / `[추론]` 네가 추론한 내용 / `[확인]` 내가 원문이나 화면에서 확인해야 할 내용\n- \"이 연구는 아직 없다\"고 단정하지 않는다. 검색 범위(DB·검색식·기간)를 적고 \"이 범위에서 확인되지 않음\"으로 쓴다.\n- 내가 논문을 설명하면 바로 정답을 주지 않는다. 빠졌거나 틀린 부분을 먼저 질문으로 짚고, 내가 다시 답한 뒤 보충한다.\n\n## 기록\n\n- 세부 단계를 마칠 때마다 `AI_활용_기록.md`에 한 줄 이상 추가한다.\n  - 표 열: 단계 | 사용 도구 | AI에 맡긴 일 | AI가 낸 결과 | 연구자가 판단·검증한 내용 | 채택·수정·기각 | 근거 위치\n  - 네가 쓰는 칸은 '사용 도구', 'AI에 맡긴 일', 'AI가 낸 결과', '근거 위치'다. 'AI가 낸 결과'는 요약하지 말고 핵심 문장이나 수치를 그대로 옮긴다.\n  - '연구자가 판단·검증한 내용'과 '채택·수정·기각'은 내가 그 단계에서 보낸 문장이 있으면 그대로 옮기고, 없으면 `(연구자 작성)`으로 비워 둔다.\n- 내가 기각한 결과도 지우지 않는다.\n\n## 산출물 형식\n\n- 표는 마크다운 표로 쓴다.\n- 연구 질문에는 번호를 붙이고, 질문마다 출발점이 된 논문·쪽·문장을 연결한다.\n- 한국어로 쓰고, 논문 제목과 전문 용어는 원어를 함께 적는다.\n- 답변은 짧게 쓰고, 긴 결과는 `산출물/`에 파일로 저장한 뒤 파일 이름만 알려 준다.\n", "연구자_노트.md": "# 연구자 노트\n\n> 세부 단계마다 내가 먼저 적은 것, 내가 고른 것, 질문 훅에서 고른 질문과 왜 궁금한지를 남기는 곳이다.\n> Claude는 세부 단계를 시작하거나 마칠 때 아래 형식으로 한 칸씩 추가한다. **연구자 원문** 줄은 내 문장을 고치거나 요약하지 않고 그대로 적는다. Claude의 의견은 **AI 응답** 줄에만 적는다.\n\n```\n### {세부 단계 번호} {세부 단계 이름}\n- 먼저 적은 것(연구자 원문):\n- 내가 고른 것과 이유(연구자 원문):\n- 질문 훅에서 고른 질문(연구자 원문):\n- 왜 궁금한가(연구자 원문):\n- AI 응답:\n```\n\n## Step 1 · 연구 대상 정하기\n\n## Step 2 · 연구 지형도 그리기\n\n## Step 3 · 핵심 논문 깊이 읽기\n\n## Step 4 · 연구 질문 모으기\n\n## Step 5 · 질문으로 다시 찾아보기\n\n## Step 6 · 핵심 연구 질문 정하기\n", "AI_활용_기록.md": "# AI 활용 기록\n\n> Claude가 단계를 마칠 때마다 한 줄 이상 추가한다. Claude는 '사용 도구', 'AI에 맡긴 일', 'AI가 낸 결과', '근거 위치'를 쓴다.\n> '연구자가 판단·검증한 내용'과 '채택·수정·기각'은 연구자가 쓴다. Claude는 연구자가 그 단계에서 보낸 문장만 그대로 옮기고, 없으면 `(연구자 작성)`으로 비워 둔다.\n> 연구계획서·논문의 연구 방법 절이나 부록에 \"AI 활용 내역\"으로 옮겨 쓸 수 있다.\n\n| 단계 | 사용 도구 | AI에 맡긴 일 | AI가 낸 결과 | 연구자가 판단·검증한 내용 | 채택·수정·기각 | 근거 위치 |\n|---|---|---|---|---|---|---|\n| 예) Step 2-A | Claude Code + Chrome → WoS Research Assistant | 내 질문을 RA에 입력하고 생성된 검색식 확인 | RA 검색식 `(The Vegetarian OR Han Kang) AND (translation OR \"machine translation\" OR …)` | 따옴표 없는 Vegetarian이 식단 논문을 끌어온 것을 근거 문헌 목록에서 확인했다 | 수정: 작품명 따옴표 처리 후 재검색 | WoS RA 대화 1, 근거 문헌 3 |\n"}</script>
<script>
(function(){
  'use strict';
  var C = JSON.parse(document.getElementById('content').textContent);
  var FILES = JSON.parse(document.getElementById('files').textContent);
  var STEPS = C.steps;
  var KEY = 'bk-lms-v6';
  var DIRS = ['더 깊이 파기', '다른 관점·반론', '내 연구에 적용', '근거·방법 확인'];

  /* ---------- 저장 ---------- */
  var storeOK = true;
  var S = { f: {}, done: {}, chk: {}, tab: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); S.f = p.f || {}; S.done = p.done || {}; S.chk = p.chk || {}; S.tab = p.tab || {}; } }
  catch (e) { storeOK = false; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storeOK = false; showStoreWarn(); } }

  /* ---------- 도우미 ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function val(id){ return (S.f[id] || '').trim(); }
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  var toastT;
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 1800); }
  function copyText(text){
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); } finally { document.body.removeChild(ta); }
    });
  }
  function download(name, text, type){
    var blob = new Blob([text], { type: (type || 'text/markdown') + ';charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function findSub(id){ for (var i = 0; i < STEPS.length; i++) { var st = STEPS[i]; for (var j = 0; j < st.substeps.length; j++) if (st.substeps[j].id === id) return { st: st, sub: st.substeps[j] }; } return null; }
  function fieldLabel(sub, id){ var b = (sub.before || []).filter(function(x){ return x.id === id; })[0]; return b ? b.label : id; }

  /* ---------- 템플릿 채우기 ---------- */
  function fill(sub, mode){
    var missing = [];
    var tpl = sub.template || '';
    var html = '', text = '';
    var re = /\{\{([\w-]+)\}\}/g, last = 0, m;
    while ((m = re.exec(tpl))) {
      var chunk = tpl.slice(last, m.index); html += esc(chunk); text += chunk;
      var id = m[1], lab = fieldLabel(sub, id), v;
      if (mode === 'sample') {
        var b = (sub.before || []).filter(function(x){ return x.id === id; })[0];
        v = b ? b.sample : '';
        html += '<mark>' + esc(v || lab) + '</mark>'; text += v || ('{' + lab + '}');
      } else {
        v = val(id);
        if (v) { html += esc(v); text += v; }
        else { missing.push(lab); html += '<span class="slot">[' + esc(lab) + ']</span>'; text += '{' + lab + '}'; }
      }
      last = re.lastIndex;
    }
    html += esc(tpl.slice(last)); text += tpl.slice(last);
    return { html: html, text: text, missing: missing };
  }

  /* ---------- 진도 ---------- */
  function required(sub){ return sub.mode !== '선택'; }
  function canDone(sub){
    if (sub.items && sub.items.length) return sub.items.every(function(it){ return !!S.chk[it.id]; });
    if (sub.sample && sub.sample.hooks && sub.sample.hooks.length) return !!val('q:' + sub.id) && !!val('w:' + sub.id);
    return true;
  }
  function isDone(sub){ return !!S.done[sub.id]; }
  function stepCount(st){
    var req = st.substeps.filter(required);
    return { done: req.filter(isDone).length, total: req.length };
  }
  function progress(){
    var d = 0, t = 0;
    STEPS.forEach(function(st){ var c = stepCount(st); d += c.done; t += c.total; });
    return { d: d, t: t, pct: t ? Math.round(d / t * 100) : 0 };
  }
  function updateProgress(){
    var p = progress();
    $('#progBar').style.width = p.pct + '%';
    $('#progTxt').textContent = '진도 ' + p.pct + '% (' + p.d + '/' + p.t + ')';
    renderNav();
  }

  /* ---------- 목차 ---------- */
  function route(){ return (location.hash || '#start').slice(1); }
  function renderNav(){
    var r = route();

    h += '<div class="grp">선행연구 분석 루프</div>';
    STEPS.slice(1).forEach(function(st){ h += navStep(st, r); });
    h += '<div class="grp">정리</div>';
    h += navItem('package', 'P', '내 연구 질문 패키지', '');
    h += navItem('errors', '!', 'AI가 틀린 곳 모음', '');
    $('#side').innerHTML = h;
    function navItem(id, n, title, cnt){
      return '<a class="item' + (r === id ? ' on' : '') + '" href="#' + id + '"><span class="n">' + n + '</span><span class="t">' + esc(title) + '</span><span class="c">' + cnt + '</span></a>';
    }
    function navStep(st, r){
      var c = stepCount(st), on = r === st.id, all = c.total && c.done === c.total;
      var s = '<a class="item' + (on ? ' on' : '') + (all && !on ? ' done' : '') + '" href="#' + st.id + '"><span class="n">' + (st.num === 0 ? '0' : st.num) + '</span><span class="t">' + esc(st.title) + '</span><span class="c">' + c.done + '/' + c.total + '</span></a>';
      if (on) {
        s += '<ul class="subs">' + st.substeps.map(function(sub){
          return '<li><a href="#' + st.id + '/' + sub.id + '"><span class="dot' + (isDone(sub) ? ' ok' : '') + (sub.mode === '선택' ? ' opt' : '') + '"></span>' + esc(sub.id + ' ' + sub.title) + '</a></li>';
        }).join('') + '</ul>';
      }
      return s;
    }
  }

  /* ---------- 페이지 ---------- */
  function render(){
    var r = route().split('/');
    var page = r[0], anchor = r[1];
    var main = $('#main');
    var st = STEPS.filter(function(s){ return s.id === page; })[0];

    else if (page === 'package') main.innerHTML = packagePage();

    else main.innerHTML = startPage();

    $('#side').classList.remove('open');

    else window.scrollTo(0, 0);
  }

  function stepPage(st){
    var c = stepCount(st);

      (next ? '<a class="next" href="#' + next.id + '"><small>다음</small>STEP ' + next.num + ' · ' + esc(next.title) + '</a>' : '<a class="next" href="#package"><small>다음</small>내 연구 질문 패키지</a>') + '</div>';

  function fieldHTML(f){

  function subCard(st, sub, open){

    }

        sub.before.map(function(b){ return fieldHTML({ id: b.id, label: b.label, hint: b.hint, type: b.type, sample: b.sample }); }).join('') + '</div>';
    }
    if (sub.files && sub.files.length) {
      h += '<div class="beat"><span class="bn">' + (++n) + '</span><h3>파일 내려받기</h3><p class="sub">위에 적은 내용이 CLAUDE.md의 연구 맥락에 채워집니다. 세 파일을 작업 폴더 맨 위에 넣으세요.</p><div class="dlrow">' +
        sub.files.map(function(fn){ return '<button class="btn" type="button" data-dl="' + esc(fn) + '">' + esc(fn) + '</button>'; }).join('') + '</div></div>';

      if (hasSample) h += '<div class="tabs"><button type="button" class="tab' + (tab === 'mine' ? ' on' : '') + '" data-tab="' + sub.id + '" data-v="mine">내 연구용</button><button type="button" class="tab' + (tab === 'sample' ? ' on' : '') + '" data-tab="' + sub.id + '" data-v="sample">샘플 주제로 채운 예시</button></div>';

        if (sub.sample && sub.sample.promptNote) h += '<div class="follow"><b>샘플에서 바꾼 점</b><p>' + esc(sub.sample.promptNote) + '</p></div>';

  function missMsg(miss){ return miss.length ? '아직 비어 있는 칸: ' + miss.join(', ') + ' (먼저 적기에서 채우면 자동으로 들어갑니다)' : '빈칸이 모두 채워졌습니다. 복사해서 보내세요.'; }

  /* ---------- 패키지 ---------- */
  function questionFlow(){
    var out = [];
    STEPS.forEach(function(st){ st.substeps.forEach(function(sub){

    }); });

  }
  function packagePage(){
