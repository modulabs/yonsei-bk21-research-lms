      '<div class="dlrow"><button class="btn primary" type="button" data-act="export-md">마크다운 파일로 내려받기</button><button class="btn" type="button" data-act="copy-md">전체 복사</button><button class="btn" type="button" data-act="backup">백업 파일 저장</button><label class="btn" style="display:inline-block">백업 불러오기<input type="file" accept="application/json,.json" data-act="restore" hidden></label></div></div>';
    h += '<div class="panel"><h2>STEP별 결과</h2><table class="t"><tbody>';
    STEPS.forEach(function(st){ (st.output && st.output.fields || []).forEach(function(f){
      h += '<tr><td style="width:34%"><small style="color:var(--faint);font-weight:700">STEP ' + st.num + '</small><br><b>' + esc(f.label) + '</b></td><td>' + (val(f.id) ? esc(val(f.id)).replace(/\n/g, '<br>') : '<span class="empty">아직 적지 않았습니다 · <a href="#' + st.id + '">STEP ' + st.num + ' 바로 가기</a></span>') + '</td></tr>';
    }); });
    h += '</tbody></table></div>';
    var flow = questionFlow();
    h += '<div class="panel"><h2>내 질문의 흐름</h2><p style="font-size:13.5px;color:var(--muted)">세부 단계마다 고른 질문과 그 이유입니다. 질문이 어떻게 바뀌어 왔는지가 연구 질문의 근거가 됩니다.</p>' +
      (flow.length ? '<ol class="flow-q">' + flow.map(function(x){ return '<li><small>' + esc(x.sub.id + ' ' + x.sub.title) + '</small>' + esc(x.q) + (x.w ? '<div class="w">왜: ' + esc(x.w) + '</div>' : '') + '</li>'; }).join('') + '</ol>' : '<p class="empty">아직 고른 질문이 없습니다.</p>') + '</div>';
    h += '<div class="panel"><h2>마무리 체크</h2>' +
      C.closing.map(function(it){ return '<label class="checkline"><input type="checkbox" data-chk="' + it.id + '"' + (S.chk[it.id] ? ' checked' : '') + '><span><b>' + esc(it.label) + '</b>' + (it.hint ? '<br><span style="color:var(--muted);font-size:13px">' + esc(it.hint) + '</span>' : '') + '</span></label>'; }).join('') + '</div>';
    return h;
  }
  function exportMD(){
    var d = new Date(), ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    var L = ['# 연구자 노트 (교안에서 내보냄, ' + ds + ')', '', '진도 ' + progress().pct + '%', ''];
    STEPS.forEach(function(st){
      L.push('## STEP ' + st.num + ' · ' + st.title, '');
      st.substeps.forEach(function(sub){
        var lines = [];
        (sub.before || []).forEach(function(b){ if (val(b.id)) lines.push('- ' + b.label + ': ' + val(b.id)); });
        if (val('q:' + sub.id)) lines.push('- 질문 훅에서 고른 질문: ' + val('q:' + sub.id));
        if (val('w:' + sub.id)) lines.push('- 왜 궁금한가: ' + val('w:' + sub.id));
        if (lines.length || isDone(sub)) { L.push('### ' + sub.id + ' ' + sub.title + (isDone(sub) ? ' (완료)' : '')); L.push.apply(L, lines); L.push(''); }
      });
      var outs = (st.output && st.output.fields || []).filter(function(f){ return val(f.id); });
      if (outs.length) { L.push('### STEP ' + st.num + ' 결과'); outs.forEach(function(f){ L.push('- ' + f.label + ': ' + val(f.id)); }); L.push(''); }
    });
    var flow = questionFlow();
    if (flow.length) { L.push('## 내 질문의 흐름', ''); flow.forEach(function(x, i){ L.push((i + 1) + '. [' + x.sub.id + '] ' + x.q + (x.w ? ' / 왜: ' + x.w : '')); }); L.push(''); }
    return L.join('\n');
  }

  function errorsPage(){
    var h = '<div class="phead"><div class="kick">검증 사례</div><h1>AI가 틀린 곳 모음</h1><p class="one">샘플 연구에서 학술 DB의 AI 기능과 Claude가 틀린 장면입니다. 같은 실수가 내 연구에서도 나올 수 있으니 결과를 받을 때마다 확인하세요.</p></div>';
    STEPS.forEach(function(st){ st.substeps.forEach(function(sub){
      var e = sub.sample && sub.sample.aiError; if (!e || !e.title) return;
      h += '<div class="panel"><small style="color:var(--faint);font-weight:700">STEP ' + st.num + ' · ' + esc(sub.id + ' ' + sub.title) + '</small><h2 style="margin-top:4px">' + esc(e.title) + '</h2><p>' + esc(e.text) + '</p>' +
        (sub.sample.images && sub.sample.images.length ? '<div class="figs">' + sub.sample.images.map(function(im){ return '<figure data-img="' + esc(im.src) + '" data-cap="' + esc(im.caption) + '"><img src="' + esc(im.src) + '" alt="' + esc(im.caption) + '" loading="lazy"><figcaption>' + esc(im.caption) + '</figcaption></figure>'; }).join('') + '</div>' : '') +
        '<p style="margin-top:10px"><a href="#' + st.id + '/' + sub.id + '">이 세부 단계로 가기</a></p></div>';
    }); });
    return h;
  }

  /* ---------- 이벤트 ---------- */
  var main = $('#main');
  main.addEventListener('input', function(e){
    var t = e.target, id = t.getAttribute('data-f'); if (!id) return;
    S.f[id] = t.value; save();
    var hit = findSubByField(id);
    if (hit) refreshSub(hit);
  });
  function findSubByField(id){
    var m = /^[qw]:(.+)$/.exec(id); if (m) return findSub(m[1]);
    for (var i = 0; i < STEPS.length; i++) for (var j = 0; j < STEPS[i].substeps.length; j++) {
      var sub = STEPS[i].substeps[j]; if ((sub.before || []).some(function(b){ return b.id === id; })) return { st: STEPS[i], sub: sub };
    }
    return null;
  }
  function refreshSub(hit){
    var sub = hit.sub;
    var pre = $('[data-prompt="' + sub.id + '"]');
    if (pre) { var r = fill(sub, 'mine'); pre.innerHTML = r.html; var mm = $('[data-miss="' + sub.id + '"]'); mm.textContent = missMsg(r.missing); mm.classList.toggle('warn', !!r.missing.length); }
    var btn = $('[data-done="' + sub.id + '"]');
    if (btn && !isDone(sub)) { btn.disabled = !canDone(sub); $('[data-donemsg="' + sub.id + '"]').textContent = doneMsg(sub); }
  }
  main.addEventListener('change', function(e){
    var t = e.target;
    var ck = t.getAttribute('data-chk');
    if (ck) { S.chk[ck] = t.checked; save(); var m = findSubByItem(ck); if (m) refreshSub(m); return; }
    if (t.getAttribute('data-act') === 'restore' && t.files && t.files[0]) {
      var rd = new FileReader();
      rd.onload = function(){ try { var p = JSON.parse(rd.result); if (!p || typeof p !== 'object' || !p.f) throw 0; S.f = p.f || {}; S.done = p.done || {}; S.chk = p.chk || {}; S.tab = p.tab || {}; save(); render(); toast('백업을 불러왔습니다'); } catch (er) { toast('백업 파일을 읽지 못했습니다'); } };
      rd.readAsText(t.files[0], 'utf-8');
    }
  });
  function findSubByItem(id){
    var m = /^c:(.+)$/.exec(id); if (m) return findSub(m[1]);
    for (var i = 0; i < STEPS.length; i++) for (var j = 0; j < STEPS[i].substeps.length; j++) {
      var sub = STEPS[i].substeps[j]; if ((sub.items || []).some(function(it){ return it.id === id; })) return { st: STEPS[i], sub: sub };
    }
    return null;
  }
  main.addEventListener('click', function(e){
    var t = e.target.closest('button, figure[data-img]'); if (!t) return;
    var v;
    if ((v = t.getAttribute('data-copy'))) {
      var hit = findSub(v), r = fill(hit.sub, 'mine');
      copyText(r.text).then(function(){ t.textContent = '복사됨'; t.classList.add('ok'); setTimeout(function(){ t.textContent = '복사'; t.classList.remove('ok'); }, 1400); toast(r.missing.length ? '복사했습니다. 빈칸 ' + r.missing.length + '개가 남아 있어요' : '복사했습니다'); }, function(){ toast('복사하지 못했습니다. 직접 선택해 복사하세요'); });
    } else if ((v = t.getAttribute('data-tab'))) {
      var which = t.getAttribute('data-v'); S.tab[v] = which; save();
      $$('[data-tab="' + v + '"]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === which); });
      $('[data-pane="' + v + '"]').hidden = which !== 'mine'; var ps = $('[data-pane-s="' + v + '"]'); if (ps) ps.hidden = which !== 'sample';
    } else if ((v = t.getAttribute('data-done'))) {
      var h2 = findSub(v); if (!h2) return;
      if (isDone(h2.sub)) delete S.done[v]; else { if (!canDone(h2.sub)) return; S.done[v] = true; }
      save();
      var card = $('#sub-' + v); var nextOpen = !isDone(h2.sub);
      card.outerHTML = subCard(h2.st, h2.sub, nextOpen);
      updateProgress();
      if (isDone(h2.sub)) {
        toast('완료했습니다');
        var subs = h2.st.substeps, k = subs.indexOf(h2.sub), nx = subs.slice(k + 1).filter(function(s){ return !isDone(s); })[0];
        if (nx) { var el = $('#sub-' + nx.id); if (el) { el.open = true; el.scrollIntoView({ block: 'start' }); } }
      }
      var mm = $('.minimap'); if (mm) mm.innerHTML = h2.st.substeps.map(function(sub){ return '<a class="' + (isDone(sub) ? 'ok' : '') + '" href="#' + h2.st.id + '/' + sub.id + '">' + esc(sub.id + ' ' + sub.title) + '</a>'; }).join('');
      var chip = $$('.phead .chip')[1]; if (chip) { var c = stepCount(h2.st); chip.textContent = '완료 ' + c.done + '/' + c.total; }
    } else if ((v = t.getAttribute('data-dl'))) {
      download(v, fileText(v));
    } else if ((v = t.getAttribute('data-act'))) {
      if (v === 'export-md') download('연구자_노트_교안내보내기.md', exportMD());
      else if (v === 'copy-md') copyText(exportMD()).then(function(){ toast('복사했습니다'); }, function(){ toast('복사하지 못했습니다'); });
      else if (v === 'backup') download('교안_백업.json', JSON.stringify(S, null, 1), 'application/json');
    } else if ((v = t.getAttribute('data-img'))) {
      var lb = $('#lb'); $('img', lb).src = v; $('p', lb).textContent = t.getAttribute('data-cap') || ''; lb.classList.add('on');
    }
  });
  function fileText(name){
    var t = FILES[name] || '';
    if (name === 'CLAUDE.md') {
      if (val('s0_who')) t = t.replace('{전공 / 석사·박사 / 학기}', val('s0_who'));
      if (val('s0_interest')) t = t.replace('{한 문장. 아직 연구 주제가 정해지지 않았으면 넓게 적는다}', val('s0_interest'));
    }
    return t;
  }
  $('#lb').addEventListener('click', function(){ this.classList.remove('on'); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') $('#lb').classList.remove('on'); });
  $('#menuBtn').addEventListener('click', function(){ $('#side').classList.toggle('open'); });
  document.querySelector('.top').addEventListener('click', function(e){ var b = e.target.closest('[data-go]'); if (b) location.hash = b.getAttribute('data-go'); });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
